unknownApparatus=An unknown apparatus
exchangePostCeramic=Exchange Post (Ceramic)
exchangePostCeramic-desc=A small outpost where traders barter ceramic goods for other essentials.
exchangePostCottonClothes=Exchange Post (Cotton Clothes)
exchangePostCottonClothes-desc=A small outpost where traders barter cotton clothes for other essentials.
exchangePostDiamond=Exchange Post (Diamond)
exchangePostDiamond-desc=A small outpost where traders barter diamonds for other essentials.
exchangePostGlassClothes=Exchange Post (Glass Clothes)
exchangePostGlassClothes-desc=A small outpost where traders barter glass clothes for other essentials.
exchangePostCleanWater=Exchange Post (Clean Water)
exchangePostCleanWater-desc=A small outpost where traders barter clean water for other essentials.
exchangePostAmmonia=Exchange Post (Ammonia)
exchangePostAmmonia-desc=A small outpost where traders barter ammonia for other essentials.
exchangePostPlastic=Exchange Post (Plastic)
exchangePostPlastic-desc=A small outpost where traders barter plastic for other essentials.
manway=Manway
manway-desc=Small, cramped access points that allow workers to enter and exit machinery and tight spaces.
fermentationVat=Fermentation Vat
fermentationVat-desc=A sealed vat of hammered metal, stained deep with years of grape juice and slow chemistry. The steady gurgle within is the sound of patience made tangible, turning raw organics into something the wealthy call culture.
brewingTank=Brewing Tank
brewingTank-desc=A squat, copper-riveted tank that smells of yeast and ambition. Workers tap its contents with practiced care, drawing out the station's modest answer to celebration. It is crude but effective, much like everything else here.
