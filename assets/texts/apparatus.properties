rescueEquipment=Rust-flecked and half-functional, these tools are the last thin thread between disaster and survival. Their creaking joints and frayed straps whisper the ghosts of past rescues that never came. In the wrong light, they look more suited for retrieval of bodies than the saving of lives.
energyStorage=Blackened capacitors hum faintly, hoarding the last scraps of power like a dragon guarding dying embers. The casing is warped from countless overloads, yet it still clings stubbornly to its purpose. Without it, the station's heartbeat would fade to silence in hours.
waterStorage=Vast rust-lined tanks loom in the dark, their contents tasting faintly of blood and iron. Every drop is rationed and watched, each leak a death sentence. You can hear the slow, echoing slosh through the corridors at night.
oxygenStorage=Heavy cylinders lie chained like prisoners, hissing in intermittent breaths. Their seals are old, and every hiss could be life leaving forever. Guards stand by, not for safety, but to decide who breathes next.
reactor=A dim, throbbing monolith buried in the earth, its core glows like an angry wound. The air around it hums with a metallic tang and low vibrations that crawl into your bones. No one dares to linger, only to feed it and flee.
barrier=Cracked walls reinforced with scavenged metal stand between the colony and the silent wasteland. They groan under the constant assault of wind and grit, holding back more than just the outside air. Some swear they hear scratching from the other side.
componentWorkshop=Shadows hang over benches littered with twisted wires and scorched tools. Here, ingenuity and desperation are hammered into crude salvation. The smell of ozone clings to every surface.
steelPlant=Furnaces roar in the darkness, eating through scavenged scrap and spitting out warped beams. The workers' faces are masked, not from pride, but to hide the taste of burning metal. Each spark feels like a fleeting imitation of the old world's light.
pressureDoor=Its bulk looms in the corridor like a tomb lid, edges scarred from countless sealings. The clang of it closing echoes like a verdict. On the wrong side, there is no appeal.
farmArray=Rows of pale, withered crops shiver under artificial light, drinking recycled water tinged with chemical bitterness. Machines hum above them like indifferent gods. The harvest is never enough.
electrolysisArray=Acid-stained machinery bubbles and spits, tearing water into breath and flame. The process stinks of metal and something older, deeper. If it stops, so will the colony's lungs.
oxygenDistributor=Rust-choked pipes snake through the walls, exhaling life in ragged, uneven gasps. Some rooms breathe more than others. No one asks why.
corpseRecycle=Cold steel cradles the still, stripping flesh from bone and bone from memory. In death, the body feeds the living in a quiet, unending cycle. The machine does not care for names.
waterRecycle=A maze of tubes gurgles faintly with water older than anyone alive. It tastes of chlorine and dust, but it is life. Every glass is both salvation and confession.
co2Recycle=Grey chambers cough and wheeze as they scrub poison into breath. Filters clog with the weight of countless exhales. The air smells faintly of fear.
ammoniaProduction=Tall tanks drip condensation like cold sweat, churning the acrid scent of survival into fertilizer and fuel. The smell clings to your clothes, your skin, your dreams. Workers keep their heads down and their mouths shut.
launchPad=A skeletal platform reaches toward the sky, its surface pitted by years of storms and neglect. Every launch is a gamble with death, but so is staying. The scorch marks never truly fade.
graves=Shallow mounds stretch to the horizon, each marked with scavenged scraps for headstones. The wind whispers the names no one says aloud. The ground here is always soft.
telescope=Its cracked lens stares endlessly into a sky that no longer answers. Operators watch faint lights move across the black, unsure if they are hope or warning. Sometimes they turn it toward the ground, just to see.
cooler=Machinery wheezes as it pumps out the heat, fighting a losing battle against the sealed world's stifling air. The vents rattle like a dying man's breath. Without it, the crops, the machines, and the people would all boil together.
metalShaft=Jagged tunnels snake deep into the earth, swallowing men and never spitting them back out. The walls drip, and the air tastes like rust and stone. Explosions echo far longer than they should.
liquidShaft=Jagged tunnels snake deep into the earth, swallowing men and never spitting them back out. The walls drip, and the air tastes like rust and stone. Explosions echo far longer than they should.
glassShaft=Jagged tunnels snake deep into the earth, swallowing men and never spitting them back out. The walls drip, and the air tastes like rust and stone. Explosions echo far longer than they should.
wiredCommunicationDevice=A tangle of frayed cables hums with static, each crackle a voice clawing through distance and time. The signal is never clear.
