response-AddInfo=Thank you. Additional information is usually safer than assumptions.
response-drama-gossip=Rumor is not evidence, however neatly it is repeated.
response2-drama-gossip=I'm sorry, but if it cannot be filed properly it should not be treated as fact.
response-drama-bullying=Intimidation is often mislabeled as efficiency, and it really should not be.
response2-drama-bullying=Please don't speak to people as if they were replaceable inventory.
response-drama-creditTheft=If work has been taken from its actual author, the record should be corrected.
response2-drama-creditTheft=That result did not belong to you, however it was presented afterward.
response-drama-favoritism=Selective exceptions have a way of damaging trust far beyond the form itself.
response2-drama-favoritism=You can't call it merit every time the same person is excused.
response-drama-overwork=Exhaustion should not keep being processed as acceptable output.
response2-drama-overwork=If people are breaking down, the paperwork is not the only thing failing.
response-drama-jealousy=It may look like jealousy, but sometimes it is simply accumulated unfairness.
response2-drama-jealousy=Please don't dismiss every objection as envy. It's not very accurate.
response-drama-blame=Reassigning fault on paper does not actually repair the damage.
response2-drama-blame=I'm sorry, but this cannot simply be transferred onto whoever looks weakest.
response-drama-exclusion=When people are left out, errors multiply in the silence.
response2-drama-exclusion=You excluded them first and then treated the fallout as their defect.
response-drama-rivalry=Unmanaged rivalry creates duplicate work, hidden sabotage, and very unpleasant forms.
response2-drama-rivalry=If everyone keeps competing like this, nobody will tell the truth in time.
response-drama-undermining=If authority is being hollowed out quietly, the station will pay for it later.
response2-drama-undermining=Smiling in meetings while erasing someone elsewhere is still erasure.
