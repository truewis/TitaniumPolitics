Talk-Rare-manager-negative=Oh, sure. Poor old Krailin hears the order and nods. Ain't that convenient.
Talk-Rare-directReport-negative=Easy, now. You bring the problem to me before it floods the whole damn deck. Clear?
Talk-Rare-Rui=You're new, but you've got grit. I can work with that.
NewAgenda=Right. I got somethin' needs said before this place springs another leak.
NewAgenda-Nominate=%1$s can hold the post. Better a steady hand than another polished fool.
NewAgenda-Praise=%1$s did the work. Say it plain and quit actin' surprised.
NewAgenda-PraiseParty=The %1$s kept the bolts tight while the rest stood around talkin'.
NewAgenda-Denounce=%1$s is all noise and no wrench. Costs us more than they fix.
NewAgenda-DenounceParty=The %1$s got soft hands and expensive mistakes.
NewAgenda-Request=Put %1$s under %2$s. You fix the pipe before the whole damn hull floods.
NewAgenda-Request-High=Yeah. That's urgent. Do it now, not after three more speeches.
NewAgenda-Request-Medium=Could work, if somebody's sober enough to follow through.
NewAgenda-Request-Low=No. That ain't worth the grease it'd cost.
NewAgenda-Promise=%1$s gets handled by me. You got my word, and I don't spend that cheap.
NewAgenda-ProofOfWork=Talk's wind. Put the work on the table where folk can kick it.
NewAgenda-BudgetProposal=Here's the budget. Ugly as a coolant spill, but it'll keep the lights on.
NewAgenda-BudgetResolution=We done dancin' round this budget? Nail it down and move on.
NewAgenda-AppointMeeting=Set the meetin'. Short, sharp, and useful for once.
NewAgenda-FireManager=%1$s can't run a crew. Pull 'em off the post before more folk get hurt.
NewTalk-KnownPositive=%1$s. Hnh. Good to see a face that ain't useless.
NewTalk-KnownPositiveResponse=Go on then, %1$s. You got my ear.
NewTalk-KnownNeutral=%1$s. Been a minute, ain't it?
NewTalk-KnownNeutralResponse=What is it, %1$s? Spit it out.
NewTalk-KnownNegative=%1$s. Make this worth stoppin' for.
NewTalk-KnownNegativeResponse=Easy now, %1$s. My patience leaks faster than old pipe.
NewTalk-Unknown=Don't reckon we've met. I'm %1$s.
NewTalk-Unknown-workplaceInfo=I run %1$s.
NewTalk-Unknown-workplaceInfo2=My patch is %1$s.
NewTalk-Unknown-response=Right then. %1$s, is it? Fine. I'm %2$s.
NewTalk-Unknown-agenda=Got a matter wants settlin' before it turns political.
NewTalk-Unknown-agendaResponse=Then say it. I ain't got all shift.
MeetingDialogue=Right. Meetin' on %1$s starts now. Shut the flap and listen.
AddInfoSupport=Hold up. I got somethin' backs this.
AddInfoDisagree=No. That ain't how it went, and you know it.
