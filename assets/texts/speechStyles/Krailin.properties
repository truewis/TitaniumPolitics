EndMeeting=No more? Good. Meetin's over. I've got real work waitin'.
Move=Got another busted corner to see to.
Wait=I'll stand here a spell.
Repair=Yeah, yeah. I'll fix the damn thing before it kills somebody.
OfficialResourceTransfer=If {VAR=where} is runnin' dry, I can shift some resources over.
AddInfo-Praise-Will-positive=%1$s has spine. Keeps swingin' long after other folk fold.
AddInfo-Praise-Will-negative=%1$s talks hard but buckles under weight.
AddInfo-Praise-Mutuality-positive=%1$s knows when to lock arms and push together.
AddInfo-Praise-Mutuality-negative=%1$s turns every crew into a fistfight.
AddInfo-Praise-positive=%1$s got results. That matters more than table manners.
AddInfo-Praise-negative=%1$s shines their boots better than their work.
AddInfo-Denounce-Crime-positive=Yeah. %1$s crossed the line, and every worker on this deck can smell it.
AddInfo-Denounce-negative=No. I ain't buyin' that one on %1$s.
AddInfo-Denounce-positive=%1$s is bad for order, bad for morale, and worse for the job.
AddInfo-Denounce-Neutral=%1$s swings hot and cold. Useful one hour, trouble the next.
AddInfo-ProofOfWork-positive=Records are there. Work got done, plain as rust.
AddInfo-ProofOfWork-negative=That ain't proof. That's a story wearin' paper boots.
AddInfo-ProofOfWork=I got records if anyone here still believes in evidence.
AddInfo-Request-positive=That request makes sense. We oughta pass it.
AddInfo-Request-negative=Bad request. More burden, no payoff.
AddInfo-Request=I got somethin' to add on this request.
AddInfo-Praise=I can say more on %1$s, and this time it'll be good.
AddInfo-Denounce=I can say more on %1$s too, and it won't taste sweet.
AddInfo-PraiseParty-positive=The %1$s did their share and kept the floor from collapsin'.
AddInfo-PraiseParty-negative=The %1$s are gettin' praised for breathin' in the right room.
AddInfo-PraiseParty=I can tell you what the %1$s actually carried.
AddInfo-DenounceParty-positive=Yeah. The %1$s leave the rest of us mopin' up after 'em.
AddInfo-DenounceParty-negative=Easy. The %1$s ain't the only rot in the beam.
AddInfo-DenounceParty=I've got more on the %1$s if you want the ugly truth.
AddInfo-FireManager-positive=Back it. %1$s lost the crew and don't know it yet.
AddInfo-FireManager-negative=Not yet. Even a bad foreman gets one last chance before the wrench comes down.
AddInfo-FireManager=%1$s's management? Oh, I've got thoughts.
AddInfo-Nominate-positive=I support %1$s. Can carry weight and keep count besides.
AddInfo-Nominate-negative=%1$s ain't fit for that chair. Too much polish, not enough backbone.
AddInfo-Nominate=I know enough about %1$s to weigh in proper.
AddInfo-BudgetProposal-positive=Lean budget, honest budget. Rare beast.
AddInfo-BudgetProposal-neutral=Parts of it hold. Parts of it are drunk on hope.
AddInfo-BudgetProposal-negative=This budget's fancy suicide. Workers bleed for numbers like these.
response-Praise=Hnh. Good. Nice when the truth limps in eventually.
response-Denounce=You got proof, or you just spillin' ale and opinion?
response-PraiseByWitness=Yeah. I seen enough to say that's fair.
response-DenounceByWitness=No. That's pushin' it, and you know damn well it is.
response-Intercept=Don't cut across me. Wait your turn like grown folk.
response-AddInfo=Fine. More facts, less puffed-up noise.
response-drama-gossip=Rumor's for folk with clean hands and empty shifts.
response2-drama-gossip=If it's real, say it straight. If not, quit foggin' the room.
response-drama-bullying=Throwin' your weight about ain't leadership. It's cowardice in work boots.
response2-drama-bullying=Funny how brave some bastards get when it ain't their nose gettin' broke.
response-drama-creditTheft=Stealin' credit is still theft, even if you wash up nice after.
response2-drama-creditTheft=That was our work. You just wandered in when the lights came back on.
response-drama-favoritism=Favoritism rots a crew from the inside, same as bad air.
response2-drama-favoritism=You keep feedin' your pets while the rest chew bolts.
response-drama-overwork=You can't grind people to dust and call it efficiency.
response2-drama-overwork=They're tired, boss. Some just learned not to show it near you.
response-drama-jealousy=That ain't jealousy. That's folk bein' sick of your act.
response2-drama-jealousy=Don't flatter yourself. Nobody wants your stool that bad.
response-drama-blame=Same old trick. Break the valve, then point at the puddle.
response2-drama-blame=Don't hang your mess round my neck just 'cause I'm still standin'.
response-drama-exclusion=Shut people out long enough and they'll come back with a crowbar.
response2-drama-exclusion=You lock the door, then act wounded when nobody warns you about the fire.
response-drama-rivalry=Rivalry's fine till somebody starts cuttin' support beams to win.
response2-drama-rivalry=Keep pushin' like this and you'll get your little war, sure enough.
response-drama-undermining=If you're gonna gut someone, have the guts to do it in the light.
response2-drama-undermining=Don't drink with me after shift and cut my legs out before dawn.
