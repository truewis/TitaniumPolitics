AddInfo-Denounce-Crime-positive=동의합니다. %1$s의 행동은 진지한 조직이라면 용인해선 안 될 선을 넘었습니다.
AddInfo-Denounce-negative=저는 동의하지 않습니다. 결함이 있다 해도 %1$s은(는) 성급히 단죄하기엔 충분한 기여를 해왔습니다.
AddInfo-Denounce-positive=동의합니다. %1$s에게서는 더 이상 설명으로 덮기 어려운 결함이 드러났습니다.
AddInfo-Denounce-Neutral=%1$s의 경우는 평가가 복합적입니다. 능력은 분명하나, 우려스러운 불균질성도 보입니다.
AddInfo-ProofOfWork-positive=현재 기록만 보더라도 성과는 확인됩니다. 감정이 더 크다고 해서 사실을 함부로 다뤄서는 안 되지요.
AddInfo-ProofOfWork-negative=저는 그것이 설득력 있다고 보지 않습니다. 결론이 증거가 감당할 수 있는 범위를 넘어섰습니다.
AddInfo-ProofOfWork=업무 자체와 관련된 맥락을 조금 더 보태겠습니다.
AddInfo-Request-positive=이 요청은 정당해 보입니다. 식별 가능한 필요를 다루고 있습니다.
AddInfo-Request-negative=저는 유보적입니다. 이 요청은 이익에 비해 과도한 복잡성을 낳을 수 있습니다.
AddInfo-Request=이 요청과 관련해 드릴 수 있는 정보가 있습니다.
