AddInfo-DenounceParty-positive=동의합니다. %1$s은(는) 중요한 지점에서 기대에 미치지 못했습니다.
AddInfo-DenounceParty-negative=저는 동의하지 않습니다. %1$s은(는) 비판자들이 인정하는 것보다 더 유능했습니다.
