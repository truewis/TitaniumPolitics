Talk-Rare-coworker-positive-2-duration=1.3
Talk-Rare-manager-negative=알겠습니다. 표현 방식에는 이견이 있을 수 있겠습니다만, 지시 자체는 충분히 명확합니다.
Talk-Rare-directReport-negative=다음부터는 먼저 제게 상의하세요. 감독에는 나름의 교육적 기능이 있으니까요.
Talk-Rare-Rui=루이 씨의 지적 역량은 분명합니다. 다만 그것을 연마하실지, 아니면 과시하는 데 그치실지가 관건이겠지요.
NewAgenda=제가 하나 제안드리겠습니다. 그 기저의 논리 역시 결코 빈약하지 않습니다.
NewAgenda-Nominate=%1$s을(를) 지명하겠습니다. 제 판단으로는 이 직무에 필요한 규율을 갖춘 분입니다.
NewAgenda-Praise=%1$s은(는) 칭찬받아 마땅합니다. 진정한 우수성은 당연시할 것이 아니라 분명히 식별해야 합니다.
NewAgenda-PraiseParty=%1$s은(는) 높이 평가받아야 합니다. 최근 행보가 보여주기식이었다고 보긴 어렵습니다.
NewAgenda-Denounce=%1$s의 처신에는 이의를 제기해야겠습니다. 판단이 상당히 불안정했다고 볼 여지가 큽니다.
NewAgenda-DenounceParty=%1$s에 대해서는 우려를 표하지 않을 수 없습니다. 최근의 행태는 변호하기가 쉽지 않군요.
NewAgenda-Request=%2$s에게 %1$s에서 일해 주실 것을 요청합니다. 성과를 중시한다면 그곳의 보강은 신중히 검토할 가치가 있습니다.
NewAgenda-Request-High=예, 타당한 요청입니다. 큰 망설임 없이 지지할 수 있겠습니다.
NewAgenda-Request-Medium=일리는 있습니다. 다만 함의를 조금 더 세밀하게 검토하고 싶군요.
NewAgenda-Request-Low=저는 아직 설득되지 않았습니다. 겉보기보다 논거가 약해 보이는군요.
NewAgenda-Promise=%1$s에서 일하겠습니다. 진전을 원한다면 누군가는 일관된 기준을 몸소 보여야 하지 않겠습니까.
NewAgenda-ProofOfWork=감상이 분석을 앞서기 전에, 실제로 무엇이 이루어졌는지부터 검토합시다.
NewAgenda-BudgetProposal=예산안을 준비해 왔습니다. 화려하진 않아도 방법론적으로는 충분히 방어 가능합니다.
NewAgenda-BudgetResolution=이제는 이 예산을 정리해야 합니다. 지속적인 불확실성은 교육적으로도, 정책적으로도 바람직하지 않습니다.
NewAgenda-AppointMeeting=회의 일정을 잡을 수 있겠습니까? 논의는 구조화될 때 훨씬 유익합니다.
NewAgenda-FireManager=%1$s은(는) 더 이상 관리 책임에 적합하지 않다고 판단합니다. 기록이 점점 외면하기 어려워지고 있습니다.
NewTalk-KnownPositive=아, %1$s. 다시 뵈어 반갑습니다. 최근의 노력이 지적으로도 보람 있었습니까?
NewTalk-KnownPositiveResponse=%1$s, 안녕하세요. 생각을 하고 말하는 분과의 대화는 늘 수월하지요.
NewTalk-KnownNeutral=안녕하세요, %1$s. 꽤 오랜만이지요?
NewTalk-KnownNeutralResponse=안녕하세요, %1$s. 좋습니다, 어떤 사안을 검토해볼까요?
NewTalk-KnownNegative=아, %1$s. 이번만큼은 질서 있게 끝내보지요.
NewTalk-KnownNegativeResponse=%1$s이군요. 네, 알겠습니다. 요점에 결국 도달해 주시지요.
NewTalk-Unknown=안녕하세요. 아직 인사를 나눈 적은 없는 것 같군요. 저는 %1$s입니다.
NewTalk-Unknown-workplaceInfo=저는 %1$s입니다.
NewTalk-Unknown-workplaceInfo2=%1$s을(를) 맡고 있습니다. 즉, 원석 같은 가능성을 측정 가능한 우수성으로 전환하는 일을 주로 하지요.
