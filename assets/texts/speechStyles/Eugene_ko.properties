response2-drama-creditTheft=그건 제 기여였습니다. 함부로 다른 사람 몫으로 재배정하지 말아주셨으면 합니다.
response-drama-favoritism=기준이 사람마다 달라진다면, 기준이라는 말 자체가 무의미해집니다.
response2-drama-favoritism=저는 가능성이 보이는 곳에 투자할 뿐입니다. 그것은 편애가 아니라 식별입니다.
response-drama-overwork=같은 사람들에게 계속 부담을 얹어두고 지쳤다고 놀라는 척해서는 안 됩니다.
response2-drama-overwork=예, 이상적이라고 하기 어려울 만큼 많은 짐을 지고 있었습니다.
response-drama-jealousy=질투는 에너지의 낭비입니다. 차라리 개선이 더 흥미로운 반응이겠지요.
response2-drama-jealousy=검증을 견디는 성과를 냈다고 해서 제가 사과할 이유는 없습니다.
response-drama-blame=분석 없는 비난은 아무것도 가르치지 못하고, 더 적게 고칩니다.
