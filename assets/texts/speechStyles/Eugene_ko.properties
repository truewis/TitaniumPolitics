Talk=아, 잠시만요. 성급함이 사고의 정밀성을 높여 주는 경우는 드뭅니다.
Talk-Rare-coworker-positive-1=유능한 분을 뵈니 반갑군요. 괜찮으시다면 관찰 결과를 차분히 대조해볼 수도 있겠습니다.
Talk-Rare-coworker-positive-1-duration=1.6
Talk-Rare-coworker-positive-2=그렇습니다. 타당한 전제 위에서 진행하지요.
