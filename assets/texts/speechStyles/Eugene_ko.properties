AddInfo-Nominate-positive=이 지명을 지지합니다. %1$s에게는 그 자리에 필요한 규율과 판단력이 있습니다.
AddInfo-Nominate-negative=저는 우려가 있습니다. 자격과 적합성은 동일한 개념이 아니니까요.
