response-drama-gossip=소문은 지적으로 게으른 도구입니다. 검증 가능한 정보를 우선해야 합니다.
response2-drama-gossip=제가 복도 gossip의 소재가 되는 일은 사양하고 싶군요.
response-drama-bullying=위압은 복종을 이끌 수는 있어도, 우수성을 길러내지는 못합니다.
response2-drama-bullying=계속 말을 끊기고 눌리는 일은, 장담하건대, 조악할 만큼 피곤합니다.
