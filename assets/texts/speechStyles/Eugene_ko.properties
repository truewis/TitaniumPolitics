AddInfo-Denounce=%1$s에 관해 고려해야 할 추가 관찰이 있습니다.
AddInfo-PraiseParty-positive=%1$s은(는) 진지한 공로를 세웠습니다. 단순한 장식적 기여라고 보긴 어렵습니다.
AddInfo-PraiseParty-negative=%1$s에 대한 칭찬은 근거에 비해 다소 과장되었다고 봅니다.
