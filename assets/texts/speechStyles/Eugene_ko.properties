response-drama-exclusion=사람을 배제하는 일은, 그 무례함과는 별개로, 조직 자체를 약화시킵니다.
response2-drama-exclusion=중요한 결정이 있을 때마다 빠지는 일은 참으로 지치는군요.
response-drama-rivalry=경쟁이 생산적일 수는 있습니다만, 목적 자체를 잠식하기 시작하면 이야기가 달라집니다.
response2-drama-rivalry=누군가 비교를 불쾌해한다고 해서 제가 물러설 생각은 없습니다.
response-drama-undermining=사적으로 동료를 깎아내리면, 공적 신뢰가 유지되리라 기대해선 안 됩니다.
response2-drama-undermining=우려가 있었다면 제게 직접, 그리고 논리적으로 말씀하실 수도 있었겠지요.
