NewTalk-Unknown-agendaResponse=물론입니다. 처음부터 차근차근 말씀해 보시지요.
MeetingDialogue=여러분, 반갑습니다. %1$s 회의를 시작하겠습니다. 운이 좋다면 끝날 때쯤에는 조금 더 현명해져 있겠지요.
AddInfoSupport=제가 조금 보충 설명을 드리겠습니다. 여기에는 생략되어서는 안 될 맥락이 있습니다.
AddInfoDisagree=저는 반대합니다. 그 논리는 면밀한 검토를 견디지 못합니다.
EndSpeech=제 발언은 여기까지 하겠습니다. {VAR=nextSpeaker}께서 이어가셔도 좋겠습니다. 더 나은 논지를 내놓으신다면 더욱 좋고요.
EndSpeech2=제 발언은 여기까지입니다. %s께서 이어가셔도 좋겠습니다.
EndMeeting=더 이상의 실질적 쟁점이 없다면, 이 회의를 마치겠습니다.
Move=실례하겠습니다. 감독이 필요한 사안은 늘 하나쯤 더 생기기 마련이니까요.
