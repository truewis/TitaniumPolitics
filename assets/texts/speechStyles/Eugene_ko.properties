AddInfo-Praise-Will-positive=그 사람의 의지는 높이 평가할 만합니다. 대중적 인식과는 별개로, 지속적인 노력은 여전히 중요합니다.
AddInfo-Praise-Will-negative=그 사람의 의지는 다소 의심스럽습니다. 규율 없는 추진력은 대개 좋은 결말을 낳지 않지요.
AddInfo-Praise-Mutuality-positive=협업 능력이 좋습니다. 재능도 유용하지만, 조율된 재능은 훨씬 더 가치가 큽니다.
AddInfo-Praise-Mutuality-negative=협업이 원활하지 않았습니다. 타인과 함께 작동하지 못하는 탁월함은 인상적이기 어렵습니다.
AddInfo-Praise-positive=성과가 우수했고 꾸준했으며, 공식적인 칭찬을 받을 만합니다.
