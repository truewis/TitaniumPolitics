phosphorite=The ash of the forgotten Earth, scraped from the bones of dead soil. More precious than ever, it feeds the last withered souls.
ration=Cold, tasteless cubes that mock the idea of food. Engineered to sustain, not to satisfy. your survival, not your dignity.
water=Clear liquid which is abundant in the station but not much so in a drinkable form.
hydrogen=The ghost of fire and flight. Harnessed by those still dreaming of stars, or of weapons that end all dreaming.
organics=Rot and refuse, reprocessed into usefulness. It's fuel for living.
lightMetal=Thin-sheeted salvage from the husks of machines. Dented, scorched, but still reshaped into tools of survival.
heavyMetal=Weighty remnants of the station's ancient structures. Carved out from buried wreckage, vital for the beasts we now ride.
rareMetal=Lustrous scraps of fallen satellites and dead reactors. Worth killing over, and many have.
silicon=Shattered circuits and sand reborn. Minds were once made from it. Now, it builds crude eyes and stubborn machines.
plastic=The immortal skin of a doomed age. Malleable and toxic, a blessing and a curse.
glass=Cracked clarity. Scavenged from towers long collapsed. Sharp enough to cut, strong enough to shield.
ceramic=Fired clay and forgotten science. Resists flame and time. Used now to hold what little we have.
diamond=Compressed pain. Not for beauty anymore, but for blades, drills, and the cutting edge of desperation.
helium=A whisper of the sky. Once lifted balloons, now lifts machines that still dare to fly above the fallout.
glassClothes=Fashioned from spun silica and desperation. They shimmer like ghosts, but wear like armor against wind and dust.
cottonClothes=Softness from a forgotten past. Rare as kindness, and just as fragile. A luxury wrapped around the bones of survivors.