phosphorus=Phosphorus
phosphorus-desc=The ash of the forgotten Earth, scraped from the bones of dead soil. More precious than ever, it feeds the last withered souls.
ration=Ration
ration-desc=Cold, tasteless cubes that mock the idea of food. Engineered to sustain, not to satisfy. Your survival, not your dignity.
water=Water
water-desc=Clear liquid which is abundant in the station but not much so in a drinkable form. Tastses like metal and regret.
cleanWater=Clean Water
cleanWater-desc=Filtered and purified, this water is a rare commodity in the wasteland.
oxygen=Oxygen
oxygen-desc=The breath of life, captured and compressed. Essential for survival in the toxic air of the wasteland.
energy=Energy
energy-desc=The lifeblood of the station, almost entirely harvested from the relentless engine. It powers everything, from lights to life support. Unlike other resources, it is transferred through the station's grid without human intervention.
hydrogen=Hydrogen
hydrogen-desc=The ghost of fire and flight. Harnessed by those still dreaming of stars, or of weapons that end all dreaming.
organics=Organics
organics-desc=Rot and refuse, reprocessed into usefulness. It's fuel for living.
lightMetal=Light Metal
lightMetal-desc=Thin-sheeted salvage from the husks of machines. Dented, scorched, but still reshaped into tools of survival.
heavyMetal=Heavy Metal
heavyMetal-desc=Weighty remnants of the station's ancient structures. Carved out from buried wreckage, vital for the beasts we now ride.
rareMetal=Rare Metal
rareMetal-desc=Lustrous scraps of fallen satellites and dead reactors. Worth killing over, and many have.
silicon=Silicon
silicon-desc=Shattered circuits and sand reborn. Minds were once made from it. Now, it builds crude eyes and stubborn machines.
plastic=Plastic
plastic-desc=The immortal skin of a doomed age. Malleable and toxic, a blessing and a curse.
glass=Glass
glass-desc=Cracked clarity. Scavenged from towers long collapsed. Sharp enough to cut, strong enough to shield.
ceramic=Ceramic
ceramic-desc=Fired clay and forgotten science. Resists flame and time. Used now to hold what little we have.
diamond=Diamond
diamond-desc=Compressed pain. Some for beauty, others for blades, drills, and the cutting edge of desperation.
helium=Helium
helium-desc=A whisper of the sky. Once lifted balloons, now lifts machines that still dare to fly above the fallout.
glassClothes=Glass Clothes
glassClothes-desc=Fashioned from spun silica and desperation. They shimmer like ghosts, but wear like armor against wind and dust.
cottonClothes=Cotton Clothes
cottonClothes-desc=Softness from a forgotten past. Rare as kindness, and just as fragile. A luxury wrapped around the bones of survivors.
component=Components
component-desc=Simple pieces of machinery. Most are stripped from the wreckage of a world that no longer turns, but some are crafted from the last remnants of knowledge.
electronics=Electronics
electronics-desc=The lifeblood of the station, these circuits and chips are the last echoes of a civilization that once thrived. They hum with the ghosts of forgotten dreams, powering the machines that keep the colony alive.
structure=Structure
structure-desc=The bones of the station, these heavy beams and plates are the foundation of survival.
plumbing=Plumbing
plumbing-desc=Vital pipes and fittings that channel water and air through the station, ensuring life in the harshest of environments.
corpse=Corpse
corpse-desc=The remains of those who once lived here. A grim reminder of the fragility of life in the wasteland.
