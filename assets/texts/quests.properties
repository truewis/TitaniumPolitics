safetyAd1=Papa, we are still waiting for you
safetyAd2={0} DAYS WITHOUT AN ACCIDENT
AlinaIllTheory1-name=Illness of Alina.
AlinaResign-name=Alina's resignation
BecameDivLeader-name=I am the infrastructure division leader.
BoyFindingMom-name=A boy with a box.
BoyFindingMom2-name=A boy with a box: Find the mother
BoyFindingMom3-name=A boy with a box: Night at the square
BefreindTheBoy-name=Befriend the boy
BefreindTheBoy2-name=A bustling day at the market
BribeDoctor0-name=Illness of Sylvia.
BribeDoctor01-name=Yuhoa's secret
BribeDoctor2-name=Talking with Dr Paik.
BribeDoctor2-title=A doctor who knows too much
BribeDoctor2-desc=Dr Paik has been quiet for too long. Whatever he is hiding behind that professional calm, it is time to hear it straight from him.
BribeDoctor3-name=Investigate the water storage
BribeDoctor3-title=Something in the water
BribeDoctor3-desc=Numbers on a form cannot tell you what the pipes are actually carrying. Go see the storage yourself before drawing any conclusions.
BribeDoctor4-name=Supply titanium tank to Welfare Station East
BribeDoctor5-name=Report to the Mentor about Sylvia
DelayRepair1-name=Agros comes by and asks to delay repairing the ammonia production system.
DelayRepair1-title=A favor that cannot be put in writing
DelayRepair1-desc=Agros did not send a formal request. He came in person, which means whatever he wants is not the kind of thing you put in a report.
DelayRepair2-name=Inspect the hospital water system
DelayRepair2-title=See it with your own eyes
DelayRepair2-desc=Secondhand reports are the currency of people who want you to reach a certain conclusion. The pipes tell a different story to anyone willing to look.
DelayRepair3-name=Hear Dr Paik's side
DelayRepair3-title=The doctor has a version too
DelayRepair3-desc=Every broken system has two sides. The pipes told you one story. Dr Paik is standing by with another, and the truth is probably somewhere neither of them wants to point.
DelayRepair4-name=Choose which repair comes first
DelayRepair4-title=Who waits and who bleeds
DelayRepair4-desc=Both repairs cannot come first. One facility keeps people breathing, the other keeps them from getting sick. Whoever you choose to wait will remember.
DelayRepair5-name=Repair the ammonia system before the shortage hits
DelayRepair5-title=Running out of time and excuses
DelayRepair5-desc=Alina has made the timeline explicit. The ammonia system does not care about politics or favors. It only cares about the clock.
ElectionApproaching-name=The election is approaching.
ElectionApproaching-title=Every seat in the room is a calculation
ElectionApproaching-desc=The election meeting is not just a formality. The people in that room have already decided what they want. The only question is whether you have too.
ExpiredWorkplaceInformation-name=Expired Workplace Information: %s
ExpiredWorkplaceInformation-title=Darkness is spreading across %s
ExpiredWorkplaceInformation-desc=Outdated information is indistinguishable from a lie. Send someone who can be trusted, or go yourself and see what has changed since the last report.
GenuineRequest-name=A reasonable request: %s
GenuineRequest-title=Someone is counting on you: %s
GenuineRequest-desc=This was not a demand and not a hint. Someone simply asked, which is rare enough to take seriously.
HatefulDirectReport-name=A direct report hates you: %s
HatefulDirectReport-title=Resentment growing in %s
HatefulDirectReport-desc=You can issue orders to someone who hates you, but you cannot trust them. Something has to change before it becomes a bigger problem.
ImprovePartyIntegrity-name=Improve Party Integrity: %s
ImprovePartyIntegrity-title=Fractures running through %s
ImprovePartyIntegrity-desc=A party that cannot agree on anything in private will not hold together when it matters. Old grudges do not disappear on their own.
KrailinDrunk1-name=Krailin at the tavern
KrailinHobby1-name=Krailin at Reservoir West
KrailinHobby2-name=Krailin at Reservoir East
ObserverIntro1-name=The Observer appears
ObserverIntro2-name=The Observer continues
ObserverIntro3-name=The Observer at the Construction Yard
ObserverIntroAfterMeeting1-name=Mysterious orders from the Observer.
ObserverIntroAfterMeeting1-title=A summons without an explanation
ObserverIntroAfterMeeting1-desc=The Observer rarely gives reasons. The instruction was simple, the destination clear, and the tone that kind of flat certainty that does not leave room for questions.
ObserverIntroAfterMeeting2-name=Visit the Observer at the Observatory
PaySalary-name=Pay Salary: %s
PaySalary-title=Debt that compounds by the day: %s
PaySalary-desc=Every unpaid hour is a quiet argument that the work was not worth it. The daily meeting is your chance to close that argument before it turns into something louder.
FirstWorkplaceMeeting-name=First morning briefing at the barrier
PrologueAlinaAccident-name=Alina's accident at the barrier
PrologueAlinaAccident2-name=Interrogation
PrologueAlinaSpeech-name=Alina's final speech
PrologueAlinaSpeech-title=The last thing she will say out loud
PrologueAlinaSpeech-desc=Whatever Alina is about to say has been weighed and measured before it reached her lips. The whole division is listening. So are you.
PrologueCtrlerCall-name=Emergency call after the accident
PrologueDecideVisitAlina-name=Resolve to visit Alina
PrologueFindNoFood-name=An empty pantry
PrologueGoHome-name=Rui returns home
PrologueVisitAlina-name=Visit Alina at the welfare station
PrologueVisitAlina-title=She is still alive, and asking for nothing
PrologueVisitAlina-desc=Alina did not ask you to come. That makes it harder, not easier. Go anyway.
ProposeBudget-name=Propose Budget: %s
ProposeBudget-title=Money unspoken is money already lost: %s
ProposeBudget-desc=Every quarter the numbers get argued over by people who have already decided what they need. Show up with something worth defending.
ResolveBudget-name=Resolve Budget: %s
ResolveBudget-title=Numbers waiting for a verdict: %s
ResolveBudget-desc=The proposal was the easy part. Now the people who disagreed in private have to say it out loud. Be there when the vote lands.
Salvor1-name=Salvor warns the new director
Salvor2-name=Salvor demands accountability
Salvor3-name=Junction failure at C12
SalvorElection-name=Salvor speaks in the election.
SecureOuterBarrierEast-name=Secure the Outer Barrier East
SecureOuterBarrierEast-title=Everything outside depends on what holds here
SecureOuterBarrierEast-desc=The outer barrier is not a wall. It is the only thing standing between the station and what the station was built to keep out. Do not let it drop.
YuhoaIntro-name=Introduction of Yuhoa

EugeneIntro-name=An invitation from Eugene
EugeneIntro-title=An invitation from someone who studies power
EugeneIntro-desc=Eugene has opinions about education that go well beyond curriculum design. He invited you personally, which suggests he thinks you might be worth the conversation.
EugeneLesson1-name=Political practices: First lesson
EugeneLesson1-title=The lesson begins before you sit down
EugeneLesson1-desc=Eugene does not waste words on people he has not already sized up. Whatever he is about to teach, he chose you for a reason.
EugeneLesson2-name=Political practices: Second lesson
EugeneLesson2-title=Trust is the prerequisite, not the reward
EugeneLesson2-desc=The second lesson does not come automatically. Eugene is watching how you carry what he already told you. Earn his confidence before asking for more.
EugeneLesson3-name=Political practices: Third lesson
EugeneLesson3-title=What he has been building toward all along
EugeneLesson3-desc=Every lesson has pointed somewhere. The final one is not a conclusion so much as a door Eugene has been slowly opening since the first time you sat down.

Vaeme1-name=Vaeme's proposal
Vaeme2-name=Vaeme's first lesson
Vaeme3-name=The real agenda
Vaeme4-name=The final lesson with Vaeme
Vaeme4-title=The last page of a very careful script
Vaeme4-desc=Vaeme has guided every session toward something she has not named yet. The final meeting will make the shape of it clear, whether you were ready for it or not.
Hans1-name=An accident at the outer barrier
Hans1-title=The scene has already started forgetting
Hans1-desc=Accidents do not hold still. Footprints disappear, equipment gets moved, and people begin constructing their version of events. Hans wants the original before that happens.
Hans2-name=Scene documentation with Hans
Hans2-title=Evidence gathered before the story sets
Hans2-desc=A report is only as honest as the moment it was written. Go back to the barrier and collect what is still raw before memory and convenience rearrange it.
Hans3-name=Hans's perspective on accidents
Hans3-title=Old habits from a place that no longer exists
Hans3-desc=Hans investigates accidents the way someone trained to investigate crimes would. Ask him why, and he might tell you more than he intended.
Hans4-name=Final accident investigation training
Hans4-title=The method and the man behind it
Hans4-desc=Hans has been teaching you how to read an accident scene, but the final session is less about the report and more about whether you understand what the report is for.
Lynn1-name=Discrepancies in the logistics report
Lynn2-name=Pressing Lynn for answers
Lynn3-name=The warehouse accident
Lynn4-name=Understanding Lynn
Lynn4-title=The numbers that do not add up to anything innocent
Lynn4-desc=The discrepancies are too consistent to be mistakes. Lynn knows that you know. Go back and make her say it out loud.
Sasha1-name=The petition backlog
Sasha1-title=A pile of paper nobody wants to read
Sasha1-desc=The petition backlog is a monument to every problem that was easier to file than to fix. Sasha wants you to see the scale of it before someone tells you it is manageable.
Sasha2-name=Following up with Sasha
Sasha2-title=Urgency buried under procedure
Sasha2-desc=Some petitions sit at the top of the queue for months. Others marked critical somehow end up buried. Sasha has been watching it happen long enough to explain why.
Sasha3-name=How bureaucracy works
Sasha3-title=Someone owns this system, and it is not the system
Sasha3-desc=The queue does not jam itself. Push hard enough and Sasha will have to say whose hands are actually on it.
Sasha4-name=Processing the petitions
Sasha4-title=The work that was always waiting
Sasha4-desc=Talking about the backlog is not the same as reducing it. Sasha has explained the problem thoroughly enough. Now it is time to actually do something about it.
Jan1-name=A teacher's view
Jan2-name=The curriculum problem
Jan3-name=Eugene's idealism
Jan4-name=Practical wisdom from Jan
Jan4-title=What the classroom walls cannot contain
Jan4-desc=Jan has been teaching longer than Eugene has been theorizing. Whatever she has been building toward in these conversations, this is where she says it plainly.
Maisarah1-name=Meeting Maisarah
Maisarah1-title=Evidence laid in front of someone who cannot ignore it
Maisarah1-desc=Maisarah has been surrounded by reports that get managed before they reach her. Bring something recent and unfiltered to the conference and see what she does with it.
Maisarah2-name=The enforcement incidents
Maisarah2-title=The gap between the rule and the enforcement
Maisarah2-desc=The safety division is not enforcing the rules Maisarah thinks she approved. Showing her side by side might be the only way to make that gap visible.
Maisarah3-name=What Maisarah witnessed
Maisarah3-title=Something she saw and cannot unremember
Maisarah3-desc=Maisarah witnessed something that does not match the official version. She has been careful about saying so. Earn enough of her trust and she might stop being careful.
Maisarah4-name=Trapped as a figurehead
Maisarah4-title=A leader with no real authority over her own division
Maisarah4-desc=Maisarah has spent years running a division she does not fully control. She is close to making a decision about what to do with that. Be there when she makes it.
Astinomis1-name=Meeting Astinomis
Astinomis1-title=A rule enforcer who needs to see what the rules cost
Astinomis1-desc=Astinomis enforces safety regulations without hesitation. Bring him the casualty numbers from the latest incident and see whether the rules he defends actually held.
Astinomis2-name=Why Astinomis is here
Astinomis2-title=The logic behind an iron hand
Astinomis2-desc=Strict enforcement this consistent is not bureaucratic habit. There is a reason Astinomis presses this hard, and it is not written in the safety manual.
Astinomis3-name=Astinomis's fear
Astinomis3-title=Fear is what the rules are built on
Astinomis3-desc=Every rule Astinomis enforces traces back to something specific that he is trying to prevent from happening again. Push him far enough and he will tell you what it is.
Astinomis4-name=The memory behind the rules
Astinomis4-title=The memory that made the safety officer
Astinomis4-desc=Whatever shaped Astinomis into the enforcer he is, he has been carrying it without explaining it. The final conversation is where that changes.

AffectionResourceRequest-name=A friend in need: %s
AffectionResourceRequest-title=Someone who trusts you is running short: %s
AffectionResourceRequest-desc=%s did not ask just anyone. The fact that they came to you means something, even if the request is practical.

AffectionActionRequest-name=Lending a hand to %s
AffectionActionRequest-title=A task too important to hand to a stranger: %s
AffectionActionRequest-desc=%s needs something done and chose to ask you specifically. That kind of trust is not given freely on a space station where everyone is watching everyone else.

AffectionPoliticalSupport-name=Political favor for %s
AffectionPoliticalSupport-title=A vote that means more than the count: %s
AffectionPoliticalSupport-desc=%s is not asking for blind loyalty. They are asking you to stand behind something you already know, because your backing carries weight that numbers alone cannot.

ThreatFromBoss-name=Your job is at risk: %s
ThreatFromBoss-title=The ceiling is getting lower: %s
ThreatFromBoss-desc=The language was careful and the tone professional, but the message was plain. Your supervisor is running out of patience and you are running out of room.

ThreatFromPeer-name=A threatening confrontation: %s
ThreatFromPeer-title=Someone decided you are the problem: %s
ThreatFromPeer-desc=%s has stopped being careful. The threats are no longer implied. You have to decide how seriously to take them before the situation decides for you.

ComplaintFromDirectReport-name=Your direct report is upset: %s
ComplaintFromDirectReport-title=Discontent rising from below: %s
ComplaintFromDirectReport-desc=%s has reached the point where staying quiet costs more than speaking up. Whatever they are about to say has been building for a while. Listen before it spreads.
