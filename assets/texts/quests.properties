safetyAd1=Papa, we are still waiting for you
safetyAd2={0} DAYS WITHOUT AN ACCIDENT
AlinaIllTheory1-name=Illness of Alina.
AlinaResign-name=Alina's resignation
BecameDivLeader-name=I am the infrastructure division leader.
BoyFindingMom-name=A boy with a box.
BoyFindingMom2-name=A boy with a box: Find the mother
BoyFindingMom3-name=A boy with a box: Night at the square
BefreindTheBoy-name=Befriend the boy
BefreindTheBoy2-name=A bustling day at the market
BribeDoctor0-name=Illness of Sylvia.
BribeDoctor01-name=Yuhoa's secret
BribeDoctor2-name=Talking with Dr Paik.
BribeDoctor2-title=Dr Paik is hiding something
BribeDoctor2-desc=He has been too composed for someone dealing with this. I need to sit down with Dr Paik and get the truth out of him, not a polished version of it.
BribeDoctor3-name=Investigate the water storage
BribeDoctor3-title=I need to see it myself
BribeDoctor3-desc=A form is not evidence. I am not going to decide anything based on what someone else wrote down. I will go to the storage and look at it with my own eyes.
BribeDoctor4-name=Supply titanium tank to Welfare Station East
BribeDoctor5-name=Report to the Mentor about Sylvia
DelayRepair1-name=Agros comes by and asks to delay repairing the ammonia production system.
DelayRepair1-title=Agros asked me in person, not on paper
DelayRepair1-desc=He came to find me directly instead of filing anything. Whatever he is about to ask, it is not the kind of favor that survives documentation. I should hear him out.
DelayRepair2-name=Inspect the hospital water system
DelayRepair2-title=I am going to look at the pipes myself
DelayRepair2-desc=Everyone I have spoken to wants me to believe something. The pipes do not have an agenda. I will go to the Welfare Station and see what is actually broken.
DelayRepair3-name=Hear Dr Paik's side
DelayRepair3-title=I should hear Dr Paik out before I decide
DelayRepair3-desc=The plumbing told me one thing. Dr Paik has been living with whatever is broken, which means he has a different story. I need both before I make a call.
DelayRepair4-name=Choose which repair comes first
DelayRepair4-title=I have to choose which repair comes first
DelayRepair4-desc=Both places need the crew. I cannot split what I have and expect either job to get done properly. Whoever I put second will be waiting, and they will know I chose.
DelayRepair5-name=Repair the ammonia system before the shortage hits
DelayRepair5-title=Alina set the clock and I am already behind
DelayRepair5-desc=Alina did not leave room for interpretation. Two days for the ammonia system. I have already spent time I did not have. I need to move now.
ElectionApproaching-name=The election is approaching.
ElectionApproaching-title=I cannot walk into that meeting without a position
ElectionApproaching-desc=Everyone else going to that meeting has already done the math. If I walk in without having done mine, I will be the only one in the room making decisions in real time.
ExpiredWorkplaceInformation-name=Expired Workplace Information: %s
ExpiredWorkplaceInformation-title=I am flying blind in %s
ExpiredWorkplaceInformation-desc=My last report on %s is too old to trust. I need someone reliable to go check, or I need to go myself. I cannot manage what I cannot see.
GenuineRequest-name=A reasonable request: %s
GenuineRequest-title=Someone actually asked me directly
GenuineRequest-desc=Nobody demanded anything. They just asked. That kind of straightforwardness is rare enough here that I should not take it lightly.
HatefulDirectReport-name=A direct report hates you: %s
HatefulDirectReport-title=Someone under me in %s has turned against me
HatefulDirectReport-desc=I can still give them orders, but that is not the same as having them on my side. If I let this fester, I will not be able to trust anything they report to me.
ImprovePartyIntegrity-name=Improve Party Integrity: %s
ImprovePartyIntegrity-title=My party is falling apart from the inside
ImprovePartyIntegrity-desc=If we cannot agree in private, we will shatter the moment something real puts pressure on us. I need to get ahead of whatever is rotting before it takes the whole structure down.
KrailinDrunk1-name=Krailin at the tavern
KrailinHobby1-name=Krailin at Reservoir West
KrailinHobby2-name=Krailin at Reservoir East
ObserverIntro1-name=The Observer appears
ObserverIntro2-name=The Observer continues
ObserverIntro3-name=The Observer at the Construction Yard
ObserverIntroAfterMeeting1-name=Mysterious orders from the Observer.
ObserverIntroAfterMeeting1-title=The Observer told me to come to the Observatory
ObserverIntroAfterMeeting1-desc=No reason, no context. Just the Observatory and that tone that does not expect me to ask why. I am not sure I want to know what this is about, but I am going.
ObserverIntroAfterMeeting2-name=Visit the Observer at the Observatory
PaySalary-name=Pay Salary: %s
PaySalary-title=I still have not paid %s
PaySalary-desc=Every day I leave this unresolved is a day I am telling them their work was not worth settling. I need to handle this at the meeting before it becomes a grievance.
FirstWorkplaceMeeting-name=First morning briefing at the barrier
PrologueAlinaAccident-name=Alina's accident at the barrier
PrologueAlinaAccident2-name=Interrogation
PrologueAlinaSpeech-name=Alina's final speech
PrologueAlinaSpeech-title=Alina is giving her final speech
PrologueAlinaSpeech-desc=She did not choose these words carelessly. The whole division is standing here and so am I. Whatever she says next is going to matter.
PrologueCtrlerCall-name=Emergency call after the accident
PrologueDecideVisitAlina-name=Resolve to visit Alina
PrologueFindNoFood-name=An empty pantry
PrologueGoHome-name=Rui returns home
PrologueVisitAlina-name=Visit Alina at the welfare station
PrologueVisitAlina-title=I should go to Alina even though she did not ask
PrologueVisitAlina-desc=She did not send for me. That almost makes it worse. I am going to the welfare station anyway. I do not know what I will say when I get there.
ProposeBudget-name=Propose Budget: %s
ProposeBudget-title=I need to bring a budget proposal for %s
ProposeBudget-desc=Everyone in that meeting already knows what they want. If I show up without a clear proposal, I will be defending nothing while everyone else defends something.
ResolveBudget-name=Resolve Budget: %s
ResolveBudget-title=The budget for %s still needs to be resolved
ResolveBudget-desc=Getting the proposal on the table was straightforward. Now comes the part where people who disagreed in private have to say so out loud. I need to be present when that happens.
Salvor1-name=Salvor warns the new director
Salvor2-name=Salvor demands accountability
Salvor3-name=Junction failure at C12
SalvorElection-name=Salvor speaks in the election.
SecureOuterBarrierEast-name=Secure the Outer Barrier East
SecureOuterBarrierEast-title=I cannot let the outer barrier fall below fifty percent
SecureOuterBarrierEast-desc=The barrier is not just infrastructure. It is the reason the station exists. If I let it degrade past the point of no return, there is no version of this where things are fine.
YuhoaIntro-name=Introduction of Yuhoa

EugeneIntro-name=An invitation from Eugene
EugeneIntro-title=Eugene invited me personally
EugeneIntro-desc=He did not send a general invitation. He asked for me specifically, which means he has already formed some opinion of me. I am curious enough to find out what it is.
EugeneLesson1-name=Political practices: First lesson
EugeneLesson1-title=Eugene is going to start teaching me
EugeneLesson1-desc=He does not do this for everyone. I do not know exactly what he has in mind, but I know he thought about it before offering. I should not take that lightly.
EugeneLesson2-name=Political practices: Second lesson
EugeneLesson2-title=I have to earn the second lesson
EugeneLesson2-desc=He is not going to continue just because I showed up. I need to demonstrate that I actually did something with what he taught me. Eugene is watching, even when he seems like he is not.
EugeneLesson3-name=Political practices: Third lesson
EugeneLesson3-title=This is what all of Eugene's lessons were leading to
EugeneLesson3-desc=Looking back, every conversation pointed toward something he was not ready to say directly. I think I am finally about to find out what that is.

Vaeme1-name=Vaeme's proposal
Vaeme2-name=Vaeme's first lesson
Vaeme3-name=The real agenda
Vaeme4-name=The final lesson with Vaeme
Vaeme4-title=Vaeme's final lesson is waiting for me
Vaeme4-desc=Every session with Vaeme has felt like a setup for something she has not said yet. The final meeting is going to name whatever that is, and I do not think I get to choose whether I am ready.
Hans1-name=An accident at the outer barrier
Hans1-title=I have to reach the barrier before anything changes
Hans1-desc=Hans told me to get there fast. Accident scenes do not stay honest for long. People start moving things, remembering things differently. I need to reach the barrier before the truth walks away.
Hans2-name=Scene documentation with Hans
Hans2-title=I need to collect evidence while it is still fresh
Hans2-desc=Whatever happened at that barrier, the honest version of it is still out there, barely. I need to go back and get it down before enough time passes that everyone has a cleaner story.
Hans3-name=Hans's perspective on accidents
Hans3-title=I want to understand why Hans investigates this way
Hans3-desc=The way Hans approaches an accident scene is not what I expected from a maintenance supervisor. There is a history behind his method. If I ask the right question, he might actually tell me what it is.
Hans4-name=Final accident investigation training
Hans4-title=Hans is waiting for me to finish this
Hans4-desc=I have been learning how to document an accident properly. But I think this last session is less about the paperwork and more about whether I actually understand why any of it matters.
Lynn1-name=Discrepancies in the logistics report
Lynn2-name=Pressing Lynn for answers
Lynn3-name=The warehouse accident
Lynn4-name=Understanding Lynn
Lynn4-title=Lynn knows I have found the discrepancies
Lynn4-desc=These numbers do not align by accident. Lynn is aware that I have looked at them closely enough to notice. I need to go back and push until she says what she has been avoiding.
Sasha1-name=The petition backlog
Sasha1-title=Sasha wants to show me how bad the backlog actually is
Sasha1-desc=I had a general sense of the backlog, but Sasha wants me to see the actual scale before someone summarizes it into something that sounds manageable. I should look at it properly.
Sasha2-name=Following up with Sasha
Sasha2-title=I need to understand why urgent petitions keep getting buried
Sasha2-desc=I have seen petitions marked urgent sit for months while others move through. Sasha has been watching this happen long enough to know the pattern. I need to hear her explain it.
Sasha3-name=How bureaucracy works
Sasha3-title=I need Sasha to tell me who is actually running the queue
Sasha3-desc=The queue is too broken in too specific a way for it to be random. Someone is making decisions about it, and Sasha knows who. I need to push until she says it.
Sasha4-name=Processing the petitions
Sasha4-title=Time to actually clear the backlog with Sasha
Sasha4-desc=We have spent enough time analyzing why the backlog exists. Sasha has given me the full picture. Now I need to sit down with her and start working through it.
Jan1-name=A teacher's view
Jan2-name=The curriculum problem
Jan3-name=Eugene's idealism
Jan4-name=Practical wisdom from Jan
Jan4-title=Jan has something she has been waiting to say
Jan4-desc=Every conversation with Jan has felt like she was circling something she was not quite ready to name. I think this one is finally where she stops circling.
Maisarah1-name=Meeting Maisarah
Maisarah1-title=I need to bring real evidence to Maisarah
Maisarah1-desc=Everything that reaches Maisarah has been filtered by the time it lands on her desk. I need to bring something unmanaged, something recent, and put it in front of her directly.
Maisarah2-name=The enforcement incidents
Maisarah2-title=I should show Maisarah what the safety division is actually doing
Maisarah2-desc=What the safety division is enforcing and what Maisarah believes she signed off on are two different things. I need to put them side by side and let her see the gap herself.
Maisarah3-name=What Maisarah witnessed
Maisarah3-title=Maisarah witnessed something she has not talked about
Maisarah3-desc=She saw something that contradicts the official account and she has been very deliberate about not saying so. If I can get her to trust me enough, she might finally stop being careful.
Maisarah4-name=Trapped as a figurehead
Maisarah4-title=Maisarah is deciding what to do about her situation
Maisarah4-desc=She has been the mining leader in title for years while someone else made the real decisions. She is reaching a breaking point. I should be there when she decides which direction to break.
Astinomis1-name=Meeting Astinomis
Astinomis1-title=I want to show Astinomis what his enforcement actually costs
Astinomis1-desc=He enforces the regulations without pause or question. I want to bring him the actual casualty numbers and see if he can explain how the rules he defends allowed this to happen.
Astinomis2-name=Why Astinomis is here
Astinomis2-title=I need to understand why Astinomis pushes this hard
Astinomis2-desc=Nobody enforces this consistently out of habit alone. There is a reason Astinomis does what he does. I want to hear it from him directly rather than guess.
Astinomis3-name=Astinomis's fear
Astinomis3-title=There is something specific Astinomis is afraid of
Astinomis3-desc=Every regulation he defends connects back to something he is determined not to let happen again. If I push far enough, he will tell me what that something actually is.
Astinomis4-name=The memory behind the rules
Astinomis4-title=Astinomis is finally going to tell me what shaped him
Astinomis4-desc=He has been carrying something for a long time without saying what it is. I think this final conversation is the one where he actually puts it down in front of me.

AffectionResourceRequest-name=A friend in need: %s
AffectionResourceRequest-title=%s came to me for help
AffectionResourceRequest-desc=%s came to me specifically, not to a process or a form. That means something. I should not treat this like a routine request.

AffectionActionRequest-name=Lending a hand to %s
AffectionActionRequest-title=%s needs my help with something important
AffectionActionRequest-desc=%s asked me, not anyone else. On a station where people are always watching and calculating, that kind of direct ask is not something I should dismiss.

AffectionPoliticalSupport-name=Political favor for %s
AffectionPoliticalSupport-title=%s is asking me to back their party
AffectionPoliticalSupport-desc=%s is not asking me to vote without thinking. They believe my support carries weight beyond the count, and they want me to stand behind something I already know enough to defend.

ThreatFromBoss-name=Your job is at risk: %s
ThreatFromBoss-title=My supervisor is threatening to fire me
ThreatFromBoss-desc=The words were chosen carefully, but I understood them. My supervisor is losing patience and I am running out of space to maneuver. I need to address this.

ThreatFromPeer-name=A threatening confrontation: %s
ThreatFromPeer-title=%s is making real threats against me
ThreatFromPeer-desc=%s is no longer being subtle. The threats are explicit now. I need to decide what to do about this before they decide for me.

ComplaintFromDirectReport-name=Your direct report is upset: %s
ComplaintFromDirectReport-title=%s is upset and I need to deal with it
ComplaintFromDirectReport-desc=%s has decided that staying quiet is no longer worth it. Whatever is coming, it has been building for a while. I should hear it before it spreads to others.
