constructionYardNorth=U.D. Construction Yard
constructionYardNorth-desc=An expanse of steel platforms, suspended gantries, and scaffolds wrapped in an ever-settling haze of welding smoke and recycled air. Highly capable managers are in charge of the construction yard, as it is far too easy to lose cargo, equipment, and even workers in the chaos.
constructionYardSouth=L.D. Construction Yard
constructionYardSouth-desc=An expanse of steel platforms, suspended gantries, and scaffolds wrapped in an ever-settling haze of welding smoke and recycled air. Highly capable managers are in charge of the construction yard, as it is far too easy to lose cargo, equipment, and even workers in the chaos.
mainControlRoom=Main Control Room
mainControlRoom-desc=A Large bunker with communication devices and conference rooms. Leaders of each division gather here every day, to hold a cabinet meeting. The triumvirate (The Controller, The Observer, and The Mechanic) also holds meeting here every day. This is the most heavily guarded and maintained facility in the station, and only essential workers can enter. Due to all the devices and security measures, space is extremely limited.
welfareStationWest=Welfare Station W.
welfareStationWest-desc=The welfare station is a sprawling complex of interconnected rooms and corridors, designed to provide shelter and support to those in need. The walls are lined with storage lockers filled with supplies, and the air is heavy with the scent of disinfectant. The main hall is a large open space with rows of cots set up for those seeking refuge. Medical equipment is scattered throughout, ready to assist those in need. The atmosphere is one of quiet determination, as the staff works tirelessly to provide care and support to those who have lost everything.
welfareStationEast=Welfare Station E.
welfareStationEast-desc=The welfare station is a sprawling complex of interconnected rooms and corridors, designed to provide shelter and support to those in need. The walls are lined with storage lockers filled with supplies, and the air is heavy with the scent of disinfectant. The main hall is a large open space with rows of cots set up for those seeking refuge. Medical equipment is scattered throughout, ready to assist those in need. The atmosphere is one of quiet determination, as the staff works tirelessly to provide care and support to those who have lost everything.
excavationShaftA=Excavation Shaft A
excavationShaftA-desc=The excavation shafts are the main access points to the station's underground tunnels and mines. They are large, dark, and echo with the sound of machinery and footsteps. The walls are lined with metal grates, allowing glimpses of the tunnels below. The air is thick with dust and the smell of oil and metal.
excavationShaftB=Excavation Shaft B
excavationShaftB-desc=The excavation shafts are the main access points to the station's underground tunnels and mines. They are large, dark, and echo with the sound of machinery and footsteps. The walls are lined with metal grates, allowing glimpses of the tunnels below. The air is thick with dust and the smell of oil and metal.
asteroidMine=Asteroid Mine
asteroidMine-desc=This is one of the creative ways our ancestors have found to extract resources from the surrounding asteroids. However, it is empty most of the time.
observatory=Observatory
observatory-desc=High above the habitation rings, in a region of the station where few lights reach and fewer footsteps echo, lies the forgotten observatory. It was once known as the Celestial Aperture, though that name has long since slipped from station directories and memory alike. No one comes here anymore;not because it's sealed, but because no one cares to look outward. Inside, the facility operates in silence. It has no need for human maintenance; its circuits hum with inherited purpose, long after its creators stopped asking the stars for answers. The space is immense and cold, the kind of cold that feels like time stopped breathing. A lattice of blackened trusses cradles the high, spherical ceiling, from which a singular aperture remains eternally open: a wound gazing into space that no longer draws wonder.
cemetery=Cemetery
cemetery-desc=The cemetery is a solemn place, filled with tall, colorless walls of named cabinets, each containing a few belongings of the forgotten dead.
spacePort=Spaceport
spacePort-desc=People forgot the spaceport long ago, but it is still there, a relic of a time when the station was a hub of interstellar travel.
tankArray=Gas Storage Tank Array
tankArray-desc=The gas storage tank array is a sprawling complex of interconnected tanks and pipes, designed to store and distribute various gases throughout the station. Hazardous and flammable gases are stored here, but as far as the tanks are well maintained and regularly inspected, they will not cause troubles.
recycleFacilityWest=Recycle Facility W.
recycleFacilityWest-desc=The recycle facility is designed to process and repurpose waste materials. The walls are lined with storage lockers filled with tools and equipment, and the air is heavy with the scent of oil and metal. The main hall is a large open space with rows of machines set up for sorting and processing materials, and a stage at the front for lectures. The atmosphere is one of quiet concentration, as workers diligently sort through piles of debris, surrounded by the hum of machinery and the sound of tools clanging against metal.
recycleFacilityEast=Recycle Facility E.
electrolysisStationSouth=L.D. Electrolysis Facility
electrolysisStationSouth-desc=Several large-scale chemical reactors are housed here, where water is split into hydrogen and oxygen. The air is thick with the smell of chemicals and the sound of bubbling liquids. The walls are lined with pipes and tanks, and the floor is slick with chemical spills.
electrolysisStationNorth=U.D. Electrolysis Facility
electrolysisStationNorth-desc=Several large-scale chemical reactors are housed here, where water is split into hydrogen and oxygen. The air is thick with the smell of chemicals and the sound of bubbling liquids. The walls are lined with pipes and tanks, and the floor is slick with chemical spills.
reservoirEast=Water Reservoir E.
reservoirEast-desc=The water reservoir is a vast, cavernous space filled with towering tanks and pipes that stretch into the darkness above. The air is heavy with the scent of damp metal and the faint hum of machinery. Water flows through the system, its surface shimmering faintly in the dim light. The walls are lined with rusted metal grates, allowing glimpses of the water's depths. Occasionally, you can hear the distant sound of water splashing or machinery clanking, echoing through the cavernous space.
reservoirWest=Water Reservoir W.
reservoirWest-desc=The water reservoir is a vast, cavernous space filled with towering tanks and pipes that stretch into the darkness above. The air is heavy with the scent of damp metal and the faint hum of machinery. Water flows through the system, its surface shimmering faintly in the dim light. The walls are lined with rusted metal grates, allowing glimpses of the water's depths. Occasionally, you can hear the distant sound of water splashing or machinery clanking, echoing through the cavernous space.
miningSchool=Mining Training School
miningSchool-desc=The mining training school provides students with the skills and knowledge they need to survive in the mines. The main hall is a large open space with rows of desks set up for students to work at, and a stage at the front for lectures. The atmosphere is one of quiet concentration, as students work diligently on their projects, surrounded by the hum of machinery and the sound of tools clanging against metal.
techSchool=Engineering Training School
techSchool-desc=The engineering training school provides a select few students with the skills and knowledge the station needs for its future. The main hall is a large open space with rows of desks set up for students to work at, and a stage at the front for lectures. The atmosphere is one of quiet concentration, as students work diligently on their projects, surrounded by the hum of machinery and the sound of tools clanging against metal.
farm=Hydroponic Farm
farm-desc=The bioengineering division grows a few different kinds of crops here. The fate of the entire station depends on the success of this farm. The crops are grown in rows, with each plant carefully tended to by a team of workers. The air is filled with the scent of soil and plants, and the sound of water dripping from the irrigation system.
rescueStationNorth=U.D. Rescue Station
rescueStationNorth-desc=This is where the members of the safety division gather to plan and coordinate their efforts to rescue those in need. Despite the name, they are also authorized to use force in the case of emergencies.
rescueStationSouth=L.D. Rescue Station E.
rescueStationSouth-desc=This is where the members of the safety division gather to plan and coordinate their efforts to rescue those in need. Despite the name, they are also authorized to use force in the case of emergencies.
rescueStationWest=L.D. Rescue Station W.
rescueStationWest-desc=This is where the members of the safety division gather to plan and coordinate their efforts to rescue those in need. Despite the name, they are also authorized to use force in the case of emergencies.
securityCheckWest=Security Checkpoint W.
securityCheckWest-desc=The security checkpoints protects the lower deck from the poverty and turmoil of the upper deck. They are heavily fortified with pressurized doors. Guards in heavy armor patrol the area, their eyes scanning for any sign of trouble. The checkpoints are equipped with scanners that can detect weapons and contraband, ensuring that only those deemed safe can pass through. The atmosphere is tense, with the ever-present threat of danger lurking just beyond the walls.
securityCheckEast=Security Checkpoint E.
securityCheckEast-desc=The security checkpoints protects the lower deck from the poverty and turmoil of the upper deck. They are heavily fortified with pressurized doors. Guards in heavy armor patrol the area, their eyes scanning for any sign of trouble. The checkpoints are equipped with scanners that can detect weapons and contraband, ensuring that only those deemed safe can pass through. The atmosphere is tense, with the ever-present threat of danger lurking just beyond the walls.
securityCheckCenter=Security Checkpoint C.
securityCheckCenter-desc=The security checkpoints protects the lower deck from the poverty and turmoil of the upper deck. They are heavily fortified with pressurized doors. Guards in heavy armor patrol the area, their eyes scanning for any sign of trouble. The checkpoints are equipped with scanners that can detect weapons and contraband, ensuring that only those deemed safe can pass through. The atmosphere is tense, with the ever-present threat of danger lurking just beyond the walls.
market=Public Market
market-desc=Tucked between the arteries of transit and the veins of maintenance shafts, the market sprawls in subdued anonymity. The largest of these is set in the upper station: an expansive corridor where rows of utilitarian shops offer products of dubious quality but undeniable affordability. This is where function supersedes form, where practicality is packaged in cheap metal packages. This is where people of dubious qualities get hired. You might be able to find a gem in the pile of rubble if you have sharp enough sense, though.
squareNorth=U.D. Public Square
squareNorth-desc=Standing in the heart of each deck, the upper and lower public squares are built upon firm beams of tempered titanium. The squares themselves are relics of ambition, once envisioned as hub of trade and culture. Now, they are places where the past hums through the vents, and shadows fall long in the dim, flickering artificial light. Still, you can occasionally hear children playing and merchants humming, oblivious to the gloomy future that awaits them. Like most of the station's megastructures, the squares stood long before any surviving historical records. It is thought they were built during the station's expansion phases by demolishing internal structures to make way for passengers and cargo. They were the first civic spaces ever attempted at such scale. Their design was bold: circular corridors ringing a vast void, above which elevator shafts hang suspended at unimaginable heights. A tessellation of dark alloy tiles bears the scuff marks of countless boots, wheels, and dreams worn thin. Around the edges, rusted vendor stalls and dormant information kiosks linger, though some still seem to be running. A constant low-frequency hum pulses from deep within the station's core, like the breath of something immense and ancient beneath the surface.
squareSouth=L.D. Public Square
squareSouth-desc=Standing in the heart of each deck, the upper and lower public squares are built upon firm beams of tempered titanium. The squares themselves are relics of ambition, once envisioned as hub of trade and culture. Now, they are places where the past hums through the vents, and shadows fall long in the dim, flickering artificial light. Still, you can occasionally hear children playing and merchants humming, oblivious to the gloomy future that awaits them. Like most of the station's megastructures, the squares stood long before any surviving historical records. It is thought they were built during the station's expansion phases by demolishing internal structures to make way for passengers and cargo. They were the first civic spaces ever attempted at such scale. Their design was bold: circular corridors ringing a vast void, above which elevator shafts hang suspended at unimaginable heights. A tessellation of dark alloy tiles bears the scuff marks of countless boots, wheels, and dreams worn thin. Around the edges, rusted vendor stalls and dormant information kiosks linger, though some still seem to be running. A constant low-frequency hum pulses from deep within the station's core, like the breath of something immense and ancient beneath the surface.
theEngine=The Engine
theEngine-desc=The engine is the heart of the station, a massive, complex machine that powers everything from the lights to the life support systems. Radioactive reactors hum with a low, steady thrum, their heat piercing through the walls. None linger here by choice; its pull is duty, not desire.
outerBarrierWest=Outer Barrier W.
outerBarrierWest-desc=The outer barrier is a massive, reinforced structure that protects the station from the harsh environment of space. It is made of thick, heavy metal plates and is designed to withstand extreme temperatures and pressures. The barrier is equipped with sensors and cameras to monitor the surrounding area for any potential threats.
outerBarrierEast=Outer Barrier E.
outerBarrierEast-desc=The outer barrier is a massive, reinforced structure that protects the station from the harsh environment of space. It is made of thick, heavy metal plates and is designed to withstand extreme temperatures and pressures. The barrier is equipped with sensors and cameras to monitor the surrounding area for any potential threats.
