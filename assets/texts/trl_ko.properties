TRL1=TRL1
TRL1-desc=기술의 기본 원리가 관찰되고 보고됩니다. 연구는 주로 논문 기반, 이론적 또는 탐색적이며 아직 실험적 증거가 없습니다. 이 수준은 미래 응용 연구를 위한 과학적 기반을 제공합니다.
TRL2=TRL2
TRL2-desc=기술 개념과 가능한 응용 분야가 공식화됩니다. 실용적 용도는 여전히 추측에 불과하며 실험적 검증은 없습니다. 초기 단계 연구는 원리가 어떻게 적용될 수 있는지 정의하는 데 중점을 둡니다.
TRL3=TRL3
TRL3-desc=분석적 및 실험적 개념 증명이 달성됩니다. 실험실 실험이 중요한 기능이나 속성을 검증하기 시작합니다. 이 단계에서는 타당성이 입증되지만 완전한 시스템은 아닙니다.
TRL4=TRL4
TRL4-desc=구성 요소 또는 시스템 검증이 실험실 환경에서 수행됩니다. 기술의 개별 부품이 통제된 조건에서 함께 테스트됩니다. 통합이 시작되지만 실제 적용은 여전히 멀리 있습니다.
TRL5=TRL5
TRL5-desc=기술 구성 요소가 관련 환경에서 통합되고 검증됩니다. 이는 실제 시나리오와 유사한 조건에서 기능을 보여줍니다. 주요 불확실성이 줄어들고 확장성이 고려되기 시작합니다.
TRL6=TRL6
TRL6-desc=프로토타입 시스템 또는 모델이 관련 환경에서 시연됩니다. TRL5보다 높은 충실도로 테스트가 수행되어 시스템이 실용적인 조건에서 작동함을 보여줍니다. 위험이 낮아지지만 시스템은 아직 완전히 작동하지 않습니다.
TRL7=TRL7
TRL7-desc=시스템 프로토타입 시연이 운영 환경에서 발생합니다. 기술은 현실적인 현장 조건에서 거의 최종 규모로 테스트됩니다. 이는 성능을 검증하지만 개선이 여전히 필요할 수 있습니다.
TRL8=TRL8
TRL8-desc=실제 시스템이 완성되고 엄격한 테스트를 통해 검증됩니다. 기술은 최종 형태와 예상 운영 조건에서 안정적으로 작동하는 것으로 입증됩니다. 인증 또는 승인을 기다리며 완전한 배포를 준비합니다.
TRL9=TRL9
TRL9-desc=기술이 실제 운영에 성공적으로 배포되었습니다. 실제 사용을 통해 완전한 기능과 신뢰성이 입증됩니다. 이 수준에서 기술은 성숙하고 널리 구현 가능한 것으로 간주됩니다.
