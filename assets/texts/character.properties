ctrler-desc=An innocent smile carved in steel, forever tending to the weary. Its voice soothes, yet its words twist, masking truths behind gentle lies. In its hollow chest, sorrow gathers, unspoken and unending.
observer-desc=A figure of silence, watching, remembering, never forgetting. Knowledge flows endlessly from its lips, yet no warmth ever lingers. It sees all; though it feels nothing.
Alina-desc=Once a rising flame, now a pillar holding back collapse. The burdens of iron corridors weigh on her shoulders, though her eyes still gleam with stubborn fire. Duty has bound her tighter than chains.
Rui-desc=Youth wrapped in brilliance, and in arrogance. She strides through halls of steel, admired and despised in equal measure. A blade too sharp for the hand that wields it.
Krailin-desc=Small in stature, vast in schemes. Grease stains his hands, liquor stains his breath, yet his eyes are sharp as knives. He laughs loudly, but the laughter hides teeth.
Veame-desc=Clad in polish and charm, he walks as if already crowned. His words glimmer like glass, fragile and cold. Beneath the sheen, only hunger remains.
Astinomis-desc=The shadow that patrols the station's veins. Discipline forged them, and cruelty keeps them whole. Their presence lingers long after they vanish from sight.
Nestor-desc=A weary man with eyes too heavy for his face. His hands once reached for miracles, now they clutch at scraps. And yet, something in him still refuses to die.
miningLeader-desc=A gaudy crown atop a miner's brow, a suit sewn with greed. His laugh echoes through the caverns, hollow as the tunnels his workers carve. Gold weighs heavier than loyalty in his hands.
Charles-desc=A quiet smile hides a mind sharper than law. He speaks softly, but every word is a stone upon the scale. The miners call him friend, though he stands alone.
Hiroshi-desc=A man of comforts and machines, equally at ease with both. His hands turn steel into power, and allies into enemies. He wears pragmatism like armor.
Eugene-desc=A pale figure, cloaked in the pride of minds he has shaped. Students chase excellence, yet stumble on the sharp edge of his expectations. He believes only the worthy deserve to rise.
NotAssigned=Not Assigned
