NewAgenda=건의할 내용이 있다.
NewAgenda-Nominate=%1$s이(가) 이 직책에 적합하다고 생각한다.
NewAgenda-Praise=%1$s의 노력에 대해 칭찬해야 한다.
NewAgenda-PraiseParty=%1$s 소속원들의 노력에 대해 칭찬해야 한다.
NewAgenda-Denounce=%1$s을(를) 신뢰해서는 안 된다.
NewAgenda-DenounceParty=%1$s 소속원들을 신뢰해서는 안 된다.
NewAgenda-Request=%2$s에게 %1$s 작업을 요청하는 바이다.
NewAgenda-Request-High=귀하의 요청을 확인했다. 즉시 후속 조치를 취할 것이다.
NewAgenda-Request-Medium=귀하의 요청은 합리적이다. 신중하게 고려할 것이다.
NewAgenda-Request-Low=귀하의 요청은 전혀 합리적이지 않다. 후속 조치는 기대하지 마라.
NewAgenda-Promise=이 그룹의 이익을 위해 %1$s에서 작업할 것을 공약한다.
NewAgenda-ProofOfWork=지금까지의 작업을 요약해 보는 것이 어떻겠나?
NewAgenda-BudgetProposal=제안하는 예산안은 다음과 같다.
NewAgenda-BudgetResolution=예산안을 확정해야 한다고 생각한다.
NewAgenda-AppointMeeting=다음 시간에 만나는 것이 어떻겠나?
NewAgenda-FireManager=%1$s이(가) 더 이상 자신의 직무에 적합하지 않다고 생각한다.
AddInfoSupport=여기에 몇 가지 정보를 추가하고 싶다.
AddInfoDisagree=뭔가 앞뒤가 맞지 않는 부분이 있다.
EndSpeech=발언을 마친다. {VAR=nextSpeaker}이(가) 추가할 내용이 있을 것이다.
EndMeeting=더 이상 논의할 주제가 없으므로 회의를 마치겠다.
Repair=음... 내가 고칠 수 있는지 보겠다.
OfficialResourceTransfer={VAR=where}에 생산 자원이 부족한가? 내가 도울 수 있다.
Move=나는 막 여기에 도착했다.
