ctrler-desc=강철에 새겨진 순수한 미소, 영원히 지친 이들을 돌봅니다. 그 목소리는 달래지만, 그 말은 뒤틀려 부드러운 거짓말 뒤에 진실을 숨깁니다. 그 텅 빈 가슴에 슬픔이 모이고, 말하지 않고 끝나지 않습니다.
observer-desc=침묵의 형상, 지켜보고, 기억하고, 결코 잊지 않습니다. 지식이 그 입술에서 끝없이 흐르지만, 따뜻함은 결코 남아있지 않습니다. 그것은 모든 것을 보지만 아무것도 느끼지 않습니다.
Alina-desc=한때 떠오르는 불꽃이었지만, 이제는 붕괴를 막는 기둥입니다. 철 복도의 짐이 그녀의 어깨에 무겁지만, 그녀의 눈은 여전히 완고한 불로 빛납니다. 의무가 그녀를 사슬보다 더 단단히 묶었습니다.
Rui-desc=찬란함과 오만함에 싸인 젊음. 그녀는 강철 복도를 걸으며, 동등한 수준으로 존경받고 경멸받습니다. 그것을 휘두르는 손에는 너무 날카로운 칼날입니다.
Krailin-desc=키는 작지만 계략은 방대합니다. 기름이 그의 손을 얼룩지게 하고, 술이 그의 숨을 얼룩지게 하지만, 그의 눈은 칼처럼 날카롭습니다. 그는 크게 웃지만, 웃음은 이를 숨깁니다.
Veame-desc=광택과 매력으로 옷을 입고, 이미 왕관을 쓴 것처럼 걷습니다. 그의 말은 유리처럼 반짝이며, 연약하고 차갑습니다. 광택 아래에는 오직 굶주림만 남아있습니다.
Astinomis-desc=스테이션의 정맥을 순찰하는 그림자. 규율이 그들을 만들었고, 잔인함이 그들을 온전하게 유지합니다. 그들의 존재는 시야에서 사라진 후에도 오래 남습니다.
Nestor-desc=얼굴에 비해 너무 무거운 눈을 가진 지친 남자. 그의 손은 한때 기적을 향했지만, 이제는 조각을 움켜쥡니다. 그러나 그 안의 무언가는 여전히 죽기를 거부합니다.
miningLeader-desc=광부의 이마에 화려한 왕관, 탐욕으로 짜여진 양복. 그의 웃음은 동굴을 통해 메아리치며, 그의 노동자들이 파는 터널만큼 텅 비어 있습니다. 금은 그의 손에서 충성보다 무겁습니다.
Charles-desc=조용한 미소가 법보다 날카로운 마음을 숨깁니다. 그는 부드럽게 말하지만, 모든 단어는 저울 위의 돌입니다. 광부들은 그를 친구라고 부르지만, 그는 홀로 서 있습니다.
Hiroshi-desc=편안함과 기계를 동등하게 편안하게 다루는 남자. 그의 손은 강철을 전력으로 바꾸고, 동맹을 적으로 바꿉니다. 그는 실용주의를 갑옷처럼 입습니다.
Eugene-desc=그가 형성한 마음의 자부심으로 감싸인 창백한 형상. 학생들은 탁월함을 쫓지만, 그의 기대의 날카로운 가장자리에 걸려 넘어집니다. 그는 가치 있는 자만이 상승할 자격이 있다고 믿습니다.
NotAssigned=할당되지 않음
