ctrler-desc=강철에 새겨진 순진한 미소로, 지친 이들을 영원히 돌보는 존재이다. 그 목소리는 위안을 주지만, 그 말은 진실을 부드러운 거짓말 뒤에 숨기며 왜곡한다. 속이 빈 가슴 속에는 말할 수 없고 끝없는 슬픔이 모여 있다.
observer-desc=침묵의 형상으로, 지켜보고, 기억하며, 결코 잊지 않는 존재이다. 지식은 그 입술에서 끝없이 흘러나오지만, 어떤 온기도 머무르지 않는다. 모든 것을 보지만, 아무것도 느끼지 못한다.
Alina-desc=한때 타오르는 불꽃이었으나, 이제는 붕괴를 막는 기둥이다. 강철 복도의 짐이 그녀의 어깨를 짓누르지만, 그녀의 눈은 여전히 완강한 불로 빛난다. 의무가 그녀를 쇠사슬보다 더 단단하게 묶었다.
Rui-desc=총명함과 오만함으로 감싸인 젊은이다. 그녀는 강철 복도를 걸으며, 똑같이 존경받고 경멸받는다. 그것은 휘두르는 손에는 너무 날카로운 검이다.
Krailin-desc=작은 체구이지만, 계획은 거대하다. 기름때가 그의 손을 더럽히고, 술이 그의 숨결을 더럽히지만, 그의 눈은 칼처럼 날카롭다. 그는 크게 웃지만, 그 웃음은 이빨을 숨긴다.
Veame-desc=윤기와 매력으로 치장하고, 이미 왕위에 오른 것처럼 걷는다. 그의 말은 유리처럼 반짝이지만, 깨지기 쉽고 차갑다. 그 광택 아래에는 굶주림만 남아 있을 뿐이다.
Astinomis-desc=기지의 혈관을 순찰하는 그림자이다. 규율이 그들을 단련했고, 잔혹함이 그들을 온전하게 유지한다. 그들의 존재는 시야에서 사라진 후에도 오랫동안 머무른다.
Nestor-desc=얼굴에는 너무 무거운 눈을 가진 지친 남자이다. 그의 손은 한때 기적을 향해 뻗었으나, 이제는 잔해를 움켜쥔다. 그럼에도 불구하고, 그의 안의 무언가는 여전히 죽기를 거부한다.
miningLeader-desc=광부의 이마 위에 놓인 화려한 왕관, 탐욕으로 꿰매어진 양복이다. 그의 웃음은 그가 파낸 터널처럼 텅 비어 동굴에 메아리친다. 그의 손에서는 금이 충성심보다 더 무겁다.
Charles-desc=조용한 미소 뒤에는 법보다 더 날카로운 정신이 숨어 있다. 그는 부드럽게 말하지만, 모든 단어는 저울 위의 돌과 같다. 광부들은 그를 친구라 부르지만, 그는 홀로 서 있다.
Hiroshi-desc=편안함과 기계에 모두 익숙한 남자이다. 그의 손은 강철을 힘으로, 동맹을 적으로 바꾼다. 그는 실용주의를 갑옷처럼 입고 있다.
Eugene-desc=그가 빚어낸 정신의 자부심으로 가려진 창백한 인물이다. 학생들은 탁월함을 쫓지만, 그의 기대라는 날카로운 모서리에 걸려 넘어진다. 그는 오직 가치 있는 자만이 일어설 자격이 있다고 믿는다.
NotAssigned=배정되지 않음
