NewAgenda-Request-Medium=귀하의 요청이 타당합니다. 철저히 검토하겠습니다.
NewAgenda-Request-Low=귀하의 요청은 전혀 합리적이지 않습니다. 후속 조치를 기대하지 마십시오.
