phosphorus=인
phosphorus-desc=잊혀진 지구의 재, 죽은 토양의 뼈에서 긁어낸 것. 그 어느 때보다 귀중하며, 마지막 시들어가는 영혼들을 먹여 살립니다.
ration=배급
ration-desc=차갑고 맛없는 큐브가 음식이라는 개념을 조롱합니다. 만족이 아닌 유지를 위해 설계되었습니다. 당신의 생존이지 존엄성이 아닙니다.
water=물
water-desc=스테이션에 풍부하지만 마실 수 있는 형태로는 그리 많지 않은 맑은 액체. 금속과 후회 맛이 납니다.
cleanWater=깨끗한 물
cleanWater-desc=여과되고 정화된 이 물은 황무지에서 희귀한 상품입니다.
oxygen=산소
oxygen-desc=생명의 숨결, 포획되고 압축되었습니다. 황무지의 독성 공기에서 생존하는 데 필수적입니다.
energy=에너지
energy-desc=스테이션의 생명선, 거의 전적으로 끊임없는 엔진에서 수확됩니다. 조명부터 생명 유지 장치까지 모든 것에 전력을 공급합니다. 다른 자원과 달리 인간의 개입 없이 스테이션의 그리드를 통해 전송됩니다.
hydrogen=수소
hydrogen-desc=불과 비행의 유령. 아직도 별을 꿈꾸는 사람들이나 모든 꿈을 끝내는 무기를 만드는 사람들이 활용합니다.
organics=유기물
organics-desc=썩은 것과 쓰레기, 유용하게 재처리되었습니다. 그것은 살아있는 것의 연료입니다.
lightMetal=경금속
lightMetal-desc=기계의 껍데기에서 나온 얇은 판 회수품. 찌그러지고 그을렸지만 여전히 생존의 도구로 재형성됩니다.
heavyMetal=중금속
heavyMetal-desc=스테이션의 고대 구조물의 무거운 잔재. 묻힌 잔해에서 조각되어, 우리가 지금 타는 야수들에게 필수적입니다.
rareMetal=희귀 금속
rareMetal-desc=떨어진 위성과 죽은 원자로의 빛나는 조각. 죽일 만한 가치가 있으며, 많은 사람들이 그렇게 했습니다.
silicon=실리콘
silicon-desc=부서진 회로와 모래가 다시 태어났습니다. 한때 마음이 만들어졌습니다. 이제는 조잡한 눈과 완고한 기계를 만듭니다.
plastic=플라스틱
plastic-desc=멸망한 시대의 불멸의 피부. 가단성이 있고 독성이 있으며, 축복이자 저주입니다.
glass=유리
glass-desc=깨진 명확성. 오래전에 무너진 탑에서 회수되었습니다. 자를 만큼 날카롭고 보호할 만큼 강합니다.
ceramic=세라믹
ceramic-desc=구운 점토와 잊혀진 과학. 불꽃과 시간에 저항합니다. 이제 우리가 가진 적은 것을 담는 데 사용됩니다.
diamond=다이아몬드
diamond-desc=압축된 고통. 일부는 아름다움을 위해, 다른 일부는 칼날, 드릴, 절망의 절단 가장자리를 위해.
helium=헬륨
helium-desc=하늘의 속삭임. 한때 풍선을 띄웠고, 이제는 낙진 위를 감히 날아가는 기계를 띄웁니다.
glassClothes=유리 옷
glassClothes-desc=방적된 실리카와 절망으로 만들어졌습니다. 그들은 유령처럼 반짝이지만 바람과 먼지에 대한 갑옷처럼 착용합니다.
cottonClothes=면 옷
cottonClothes-desc=잊혀진 과거의 부드러움. 친절만큼 희귀하고, 그만큼 연약합니다. 생존자의 뼈 주위에 감싸인 사치품.
component=부품
component-desc=기계의 간단한 조각. 대부분은 더 이상 돌아가지 않는 세계의 잔해에서 벗겨졌지만, 일부는 지식의 마지막 잔재로 만들어졌습니다.
electronics=전자제품
electronics-desc=스테이션의 생명선, 이 회로와 칩은 한때 번성했던 문명의 마지막 메아리입니다. 그들은 잊혀진 꿈의 유령과 함께 윙윙거리며, 식민지를 살아있게 하는 기계에 전력을 공급합니다.
structure=구조물
structure-desc=스테이션의 뼈, 이 무거운 보와 판은 생존의 기반입니다.
plumbing=배관
plumbing-desc=물과 공기를 스테이션을 통해 운반하는 필수 파이프와 피팅으로, 가혹한 환경에서 생명을 보장합니다.
corpse=시체
corpse-desc=한때 이곳에 살았던 사람들의 유해. 황무지에서의 삶의 연약함을 상기시키는 음침한 기억입니다.
fineFood=고급 식품
fineFood-desc=스테이션의 수경 재배 구역에서 정성껏 키운 진미. 살아있는 이유를 떠올리게 해 주는 귀한 사치품입니다.
wine=와인
wine-desc=정거장의 수경 재배 유기물에서 발효된 이 와인은 빈티지 보물이 아닙니다. 하지만 사치품이 배급하지 않아도 되는 것으로 정의되는 곳에서는, 한 잔의 와인이 맛 그 이상의 무게를 지닙니다.
clover=클로버 브루
clover-desc=희미한 단맛이 남아 있는 진하고 쓴 맥주입니다. 클로버 양조장의 깊은 곳에서 곡물과 인산 화합물로 만들어집니다. 단골들은 기운을 돋운다고 맹세하지만, 정거장 기록은 대체로 그들을 순응하게 만든다고 시사합니다.
