rescueEquipment=구조 장비
rescueEquipment-desc=녹슨 점으로 얼룩지고 반쯤 작동하는 이 도구들은 재앙과 생존 사이의 마지막 가는 실입니다. 그들의 삐걱거리는 관절과 해진 끈은 결코 오지 않은 과거 구조의 유령을 속삭입니다. 잘못된 빛에서는 생명을 구하기보다는 시신 회수에 더 적합해 보입니다.
energyStorage=배터리 어레이
energyStorage-desc=검게 그을린 커패시터가 희미하게 윙윙거리며, 죽어가는 불씨를 지키는 용처럼 마지막 전력 조각을 비축합니다. 케이싱은 수없이 많은 과부하로 뒤틀렸지만 여전히 그 목적에 완고하게 매달립니다. 그것이 없으면 스테이션의 심장박동은 몇 시간 안에 침묵으로 사라질 것입니다.
waterStorage=물탱크
waterStorage-desc=녹으로 늘어선 거대한 탱크가 어둠 속에 우뚝 솟아 있으며, 그 내용물은 피와 철의 맛이 희미하게 납니다. 모든 한 방울이 배급되고 감시되며, 각 누출은 사형 선고입니다. 밤에 복도를 통해 느린 메아리치는 철썩거림을 들을 수 있습니다.
oxygenStorage=산소 탱크
oxygenStorage-desc=무거운 실린더가 포로처럼 묶여 누워 있으며, 간헐적인 숨으로 쉿 소리를 냅니다. 그들의 봉인은 오래되었고, 모든 쉿 소리는 영원히 떠나는 생명일 수 있습니다. 경비원들이 안전을 위해서가 아니라 누가 다음에 숨을 쉴지 결정하기 위해 대기하고 있습니다.
reactor=원자로
reactor-desc=땅에 묻힌 희미하게 고동치는 거석, 그 핵심은 분노한 상처처럼 빛납니다. 주변 공기는 금속성 냄새와 뼈 속으로 기어 들어가는 낮은 진동으로 윙윙거립니다. 아무도 감히 머물지 않고, 단지 먹이를 주고 도망칩니다.
barrier=스테이션 장벽
barrier-desc=회수한 금속으로 강화된 금이 간 벽이 식민지와 조용한 황무지 사이에 서 있습니다. 그들은 바람과 모래의 끊임없는 공격 아래 신음하며, 외부 공기보다 더 많은 것을 막아줍니다. 일부는 반대편에서 긁는 소리를 듣는다고 맹세합니다.
componentWorkshop=부품 작업장
componentWorkshop-desc=꼬인 전선과 그을린 도구들로 어질러진 작업대 위에 그림자가 걸려 있습니다. 여기에서 창의성과 절망이 조잡한 구원으로 두들겨집니다. 오존 냄새가 모든 표면에 달라붙습니다.
plumbingWorkshop=배관 작업장
plumbingWorkshop-desc=파이프와 피팅이 공간을 어지럽히고, 일부는 테이프로 패치되고 다른 일부는 임시 토치로 용접됩니다. 공기는 녹과 땀 냄새가 나며, 누수와 오염에 대한 끝없는 전투의 증거입니다.
electronicsWorkshop=전자 작업장
electronicsWorkshop-desc=희미한 불빛이 회로 기판과 납땜 인두로 흩어진 작업대 위로 깜박입니다. 반쯤 작동하는 기계의 윙윙거림이 공기를 채우며, 침묵한 세계에서 생존의 교향곡입니다.
glassClothesWorkshop=유리 옷 작업장
glassClothesWorkshop-desc=실리카 조각이 가혹한 빛 아래 반짝이며, 직조 기술에 능숙한 손이 지칠 줄 모르고 작업합니다. 공기는 먼지로 두껍고 용융 유리의 날카로운 냄새가 나며, 옷과 그것들이 보호하는 생명 모두의 연약함을 상기시킵니다.
cottonClothesWorkshop=면 옷 작업장
cottonClothesWorkshop-desc=부드러운 천과 닳은 재봉틀이 좁은 공간을 채웁니다. 오래된 면의 냄새가 노동자들의 땀과 섞이며, 편안함만큼이나 생존에 관한 의류를 제작합니다.
plasticWorkshop=플라스틱 작업장
plasticWorkshop-desc=재활용된 플라스틱 조각이 녹아서 새로운 형태로 성형되며, 공기는 연기와 타는 폴리머 냄새로 두껍습니다. 그것은 쓰레기가 필요성이 되는 곳이며, 모든 창조물은 작은 승리입니다.
metalWorkshop=금속 작업장
steelPlant=제강소
steelPlant-desc=용광로가 어둠 속에서 포효하며, 회수한 고철을 먹어치우고 뒤틀린 보를 뱉어냅니다. 노동자들의 얼굴은 가려져 있는데, 자부심 때문이 아니라 타는 금속의 맛을 숨기기 위해서입니다. 각 불꽃은 구세계의 빛의 덧없는 모방처럼 느껴집니다.
pressureDoor=압력 도어
pressureDoor-desc=그것의 덩치는 복도에서 무덤 뚜껑처럼 우뚝 솟아 있으며, 가장자리는 수없이 많은 봉인으로 흉터가 있습니다. 그것이 닫히는 쾅 소리는 판결처럼 메아리칩니다. 잘못된 쪽에서는 항소가 없습니다.
farmArray=농장 어레이
farmArray-desc=창백하고 시든 작물의 줄이 인공 조명 아래 떨며, 화학적 쓴맛이 감도는 재활용된 물을 마십니다. 기계가 무관심한 신들처럼 그들 위에서 윙윙거립니다. 수확은 결코 충분하지 않습니다.
electrolysisArray=전기분해 어레이
electrolysisArray-desc=산으로 얼룩진 기계가 거품을 내고 뱉으며, 물을 숨과 불꽃으로 찢습니다. 이 과정은 금속과 더 오래되고 깊은 무언가의 냄새가 납니다. 그것이 멈추면 식민지의 폐도 멈출 것입니다.
oxygenDistributor=산소 분배기
oxygenDistributor-desc=녹으로 막힌 파이프가 벽을 통해 뱀처럼 기어가며, 너덜너덜하고 고르지 않은 숨으로 생명을 내뿜습니다. 일부 방은 다른 방보다 더 많이 숨을 쉽니다. 아무도 이유를 묻지 않습니다.
corpseRecycle=소각로
corpseRecycle-desc=차가운 강철이 고요함을 요람에 담고, 살에서 뼈를 벗기고 뼈에서 기억을 벗깁니다. 죽음에서 몸은 조용하고 끝없는 순환으로 살아있는 자를 먹입니다. 기계는 이름을 신경 쓰지 않습니다.
waterRecycle=물 응축기
waterRecycle-desc=누구보다 오래된 물이 희미하게 꾸르륵거리는 튜브의 미로. 그것은 염소와 먼지 맛이 나지만 생명입니다. 모든 잔은 구원이자 고백입니다.
co2Recycle=이산화탄소 재활용
co2Recycle-desc=회색 챔버가 기침하고 쌕쌕거리며 독을 숨으로 문지릅니다. 필터는 수없이 많은 호흡의 무게로 막힙니다. 공기는 희미하게 두려움 냄새가 납니다.
ammoniaProduction=암모니아 생산 창고
ammoniaProduction-desc=높은 탱크가 차가운 땀처럼 응결을 흘리며, 생존의 자극적인 냄새를 비료와 연료로 휘젓습니다. 냄새는 옷, 피부, 꿈에 달라붙습니다. 노동자들은 고개를 숙이고 입을 다물고 있습니다.
launchPad=발사대
launchPad-desc=뼈대 플랫폼이 하늘을 향해 뻗어 있으며, 표면은 수년간의 폭풍과 방치로 구덩이가 있습니다. 모든 발사는 죽음과의 도박이지만 머무르는 것도 마찬가지입니다. 그을린 자국은 결코 진정으로 사라지지 않습니다.
graves=무덤
graves-desc=얕은 언덕이 지평선까지 뻗어 있으며, 각각은 묘비로 회수한 조각으로 표시되어 있습니다. 바람이 아무도 큰 소리로 말하지 않는 이름을 속삭입니다. 여기 땅은 항상 부드럽습니다.
telescope=망원경
telescope=desc=그것의 금이 간 렌즈는 더 이상 대답하지 않는 하늘을 끝없이 응시합니다. 운영자는 희미한 빛이 검은색을 가로질러 움직이는 것을 지켜보며, 그것이 희망인지 경고인지 확신하지 못합니다. 때때로 그들은 그것을 땅으로 돌립니다. 단지 보기 위해.
cooler=냉각기
cooler-desc=기계가 쌕쌕거리며 열을 펌핑하며, 밀폐된 세계의 답답한 공기에 대한 패배의 전투를 벌입니다. 환기구가 노력으로 덜컥거리고, 추위는 먼 기억처럼 느껴집니다.
metalStorage=금속 저장소
metalStorage-desc=회수한 금속 더미가 조용한 파수꾼처럼 우뚝 솟아 있으며, 그들의 표면은 시간과 방치로 흉터가 있습니다. 각 조각은 잠재적인 도구, 무기 또는 잃어버린 것의 상기입니다.
componentStorage=부품 저장소
componentStorage-desc=상자가 꼬인 전선과 부서진 회로로 넘치며, 한때 번성했던 세계의 잔재입니다.
rationStorage=배급 저장소
rationStorage-desc=건조 식품과 통조림 상자가 선반에 줄지어 있으며, 라벨이 바래고 찢어졌습니다. 모든 식사는 부족과 생존의 상기입니다.
status-running={COLOR=WHITE}%1$s는 내구성 %2$.0f %%로 작동하고 있었습니다.
status-broken={COLOR=RED}%1$s가 고장났습니다.
status-highTemp={COLOR=YELLOW}과열되었습니다. 최대 작동 온도는 %1$.0f이지만 주변 온도는 %2$.0f였습니다.
status-lowTemp={COLOR=YELLOW}동결되었습니다. 최소 작동 온도는 %1$.0f이지만 주변 온도는 %2$.0f였습니다.
status-worker={COLOR=WHITE}%2$d명의 작업자가 작업했으며 효율은 %1$.0f %%였습니다.
status-overWorked={COLOR=YELLOW}할당된 작업자가 너무 많을 수 있습니다.
status-underWorked={COLOR=YELLOW}할당된 작업자가 너무 적을 수 있습니다.
status-minimumDanger={COLOR=WHITE}작업하기에 비교적 안전합니다.
status-mediumDanger={COLOR=YELLOW}작업하기에 위험합니다.
status-highDanger={COLOR=RED}작업 조건이 극도로 위험하며, 재앙을 방지하기 위해 즉각적인 검사가 필요합니다.
unknownApparatus=알 수 없는 장치
exchangePostCeramic=교환소 (세라믹)
exchangePostCeramic-desc=상인들이 세라믹 상품을 다른 필수품과 교환하는 작은 전초 기지입니다.
exchangePostCottonClothes=교환소 (면 옷)
exchangePostCottonClothes-desc=상인들이 면 옷을 다른 필수품과 교환하는 작은 전초 기지입니다.
exchangePostDiamond=교환소 (다이아몬드)
exchangePostDiamond-desc=상인들이 다이아몬드를 다른 필수품과 교환하는 작은 전초 기지입니다.
exchangePostGlassClothes=교환소 (유리 옷)
exchangePostGlassClothes-desc=상인들이 유리 옷을 다른 필수품과 교환하는 작은 전초 기지입니다.
exchangePostCleanWater=교환소 (깨끗한 물)
exchangePostCleanWater-desc=상인들이 깨끗한 물을 다른 필수품과 교환하는 작은 전초 기지입니다.
exchangePostAmmonia=교환소 (암모니아)
exchangePostAmmonia-desc=상인들이 암모니아를 다른 필수품과 교환하는 작은 전초 기지입니다.
exchangePostPlastic=교환소 (플라스틱)
exchangePostPlastic-desc=상인들이 플라스틱을 다른 필수품과 교환하는 작은 전초 기지입니다.
