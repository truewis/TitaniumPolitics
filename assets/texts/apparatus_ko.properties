rescueEquipment=구조 장비
rescueEquipment-desc=녹이 슬고 반쯤 고장 난 이 도구들은 재난과 생존을 잇는 마지막 가는 실이다. 삐걱거리는 이음새와 해진 끈은 성공하지 못한 과거 구조 작업의 유령을 속삭인다. 잘못된 불빛 아래에서는 생명을 구하기보다 시신 수습에 더 적합해 보이는 도구들이다.
energyStorage=배터리 배열
energyStorage-desc=검게 그을린 축전기들이 희미하게 윙윙거리며, 꺼져가는 불씨를 지키는 용처럼 마지막 전력 조각들을 비축하는 중이다. 외함은 수많은 과부하로 휘어졌지만, 여전히 제 목적에 끈질기게 매달려 있는 장치이다. 이것 없이는 기지의 심장 박동이 몇 시간 안에 침묵하게 될 것이다.
waterStorage=물탱크
waterStorage-desc=거대한 녹슨 탱크들이 어둠 속에 우뚝 솟아 있으며, 그 내용물에서는 희미하게 피와 철의 맛이 난다. 한 방울 한 방울이 배급되고 감시되며, 모든 누수는 사형 선고와 같다. 밤에는 복도를 통해 느리고 메아리치는 출렁거림을 들을 수 있다.
oxygenStorage=산소 탱크
oxygenStorage-desc=무거운 실린더들이 죄수처럼 쇠사슬에 묶여 간헐적으로 쉭쉭거리는 숨소리를 낸다. 봉인은 오래되었고, 모든 쉭쉭거림은 생명이 영원히 떠나는 것일 수 있다. 경비원들은 안전이 아닌, 누가 다음에 숨을 쉴지 결정하기 위해 옆에 서 있는 것이다.
reactor=원자로
reactor-desc=땅속에 묻힌 희미하고 욱신거리는 단일체이며, 그 핵은 성난 상처처럼 빛나는 것이다. 그 주변 공기는 금속성 얼얼함과 뼈 속으로 기어 들어오는 낮은 진동으로 윙윙거린다. 아무도 감히 오래 머물지 않고, 단지 연료를 공급하고 도망치는 곳이다.
barrier=기지 방벽
barrier-desc=주워 모은 금속으로 보강된 균열이 간 벽들이 식민지와 정적의 황무지 사이에 서 있다. 그것들은 끊임없는 바람과 모래의 공격 아래 신음하며, 단순한 외부 공기 이상의 것을 막아낸다. 어떤 이들은 반대편에서 긁는 소리를 듣는다고 맹세한다.
componentWorkshop=부품 작업장
componentWorkshop-desc=꼬인 전선과 그을린 도구들이 흩어진 작업대 위에 그림자가 드리워져 있다. 이곳은 독창성과 절망이 조악한 구원으로 벼려지는 곳이다. 오존 냄새가 모든 표면에 달라붙어 있다.
plumbingWorkshop=배관 작업장
plumbingWorkshop-desc=파이프와 부속품들이 공간을 어지럽히고 있으며, 일부는 테이프로 패치되었고 다른 일부는 임시 토치로 용접되었다. 공기는 녹과 땀 냄새로 가득하며, 누수와 오염에 대한 끝없는 싸움을 증명하는 곳이다.
electronicsWorkshop=전자제품 작업장
electronicsWorkshop-desc=회로 기판과 납땜 인두가 흩어져 있는 작업대 위에 희미한 불빛이 깜박인다. 반쯤 작동하는 기계들의 윙윙거리는 소리가 공기를 채우며, 침묵해 버린 세상 속에서 생존의 교향곡을 연주한다.
glassClothesWorkshop=유리 섬유 의류 작업장
glassClothesWorkshop-desc=규소 조각들이 거친 불빛 아래 반짝이며, 직조 기술에 숙련된 손들이 지칠 줄 모르고 일한다. 공기는 먼지와 녹은 유리 섬유의 날카로운 냄새로 가득하며, 옷과 그 옷이 보호하는 생명 모두의 취약함을 상기시키는 곳이다.
cottonClothesWorkshop=면 의류 작업장
cottonClothesWorkshop-desc=부드러운 직물과 낡은 재봉틀이 좁은 공간을 채운다. 오래된 면 냄새가 노동자들의 땀과 뒤섞여, 생존만큼이나 편안함에 관한 의복을 제작하는 곳이다.
plasticWorkshop=플라스틱 작업장
plasticWorkshop-desc=재활용된 플라스틱 조각들이 녹아 새로운 형태로 성형되며, 공기는 연기와 타는 폴리머 냄새로 가득하다. 이곳은 쓰레기가 필수가 되고, 모든 창조물이 작은 승리가 되는 곳이다.
metalWorkshop=금속 작업장
steelPlant=제철소
steelPlant-desc=용광로가 어둠 속에서 포효하며, 주워 모은 고철을 먹어치우고 휘어진 빔을 뱉어낸다. 작업자들의 얼굴은 자부심이 아니라 타는 금속의 맛을 숨기기 위해 마스크로 가려져 있다. 각 스파크는 옛 세계 빛의 덧없는 모방처럼 느껴진다.
pressureDoor=가압문
pressureDoor-desc=그 거대한 몸체가 무수한 밀봉으로 흉터가 난 가장자리와 함께 복도에 무덤 뚜껑처럼 우뚝 서 있다. 닫히는 쾅 소리는 판결처럼 메아리친다. 문틀의 잘못된 쪽에 있다면, 항소는 없는 것이다.
farmArray=농장 배열
farmArray-desc=창백하고 시든 작물들이 화학적 쓴맛이 섞인 재활용된 물을 마시며 인공 불빛 아래 떨고 있다. 기계들은 무관심한 신들처럼 그 위에서 윙윙거린다. 수확은 결코 충분하지 않은 곳이다.
electrolysisArray=전기 분해 배열
electrolysisArray-desc=산성 얼룩이 진 기계는 거품을 내고 뱉어내며, 물을 찢어 호흡과 불꽃으로 만든다. 그 과정에서 금속과 더 오래되고 깊은 무언가의 냄새가 난다. 이것이 멈춘다면, 식민지의 폐도 멈추게 될 것이다.
oxygenDistributor=산소 분배기
oxygenDistributor-desc=녹으로 막힌 파이프가 벽을 통해 뱀처럼 기어가며, 거칠고 불규칙한 한숨으로 생명을 내뿜는다. 어떤 방은 다른 방보다 더 많이 숨을 쉰다. 아무도 그 이유를 묻지 않는다.
corpseRecycle=소각로
corpseRecycle-desc=차가운 강철은 고요한 몸을 안아, 뼈에서 살점을 벗겨내고 기억에서 뼈를 벗겨낸다. 죽음 속에서 몸은 조용하고 끝없는 순환 속에서 산 자를 먹이는 것이다. 기계는 이름에 개의치 않는다.
waterRecycle=응축수 처리기
waterRecycle-desc=미로 같은 튜브는 살아 있는 누구보다도 오래된 물과 함께 희미하게 꼬르륵거린다. 염소와 먼지 맛이 나지만, 그것이 생명이다. 모든 잔은 구원이자 고백이다.
co2Recycle=이산화탄소 재활용기
co2Recycle-desc=회색 방들은 독을 닦아내고 숨으로 만들면서 기침하고 헐떡거린다. 필터는 무수한 날숨의 무게로 막힌다. 공기에서는 희미하게 두려움 냄새가 난다.
ammoniaProduction=암모니아 생산 기지
ammoniaProduction-desc=높은 탱크는 차가운 땀처럼 응결수를 떨어뜨리며, 생존의 시큼한 냄새를 비료와 연료로 휘젓는다. 그 냄새는 당신의 옷, 피부, 꿈에 달라붙는다. 작업자들은 고개를 숙이고 입을 다문다.
launchPad=발사대
launchPad-desc=뼈대만 남은 플랫폼이 하늘을 향해 뻗어 있으며, 그 표면은 수년간의 폭풍과 방치로 구멍이 뚫렸다. 모든 발사는 죽음과의 도박이지만, 머무는 것도 마찬가지이다. 그을음 자국은 결코 완전히 사라지지 않는다.
graves=무덤
graves-desc=얕은 봉분들이 수평선까지 뻗어 있으며, 각 봉분은 주워 모은 고철로 묘비를 표시했다. 바람은 아무도 소리 내어 말하지 않는 이름들을 속삭인다. 이곳의 땅은 항상 부드럽다.
telescope=망원경
telescope-desc=금이 간 렌즈는 더 이상 답하지 않는 하늘을 끝없이 응시한다. 조작자들은 희미한 빛이 검은색을 가로질러 움직이는 것을 보면서, 그것이 희망인지 경고인지 확신하지 못한다. 때로는 그냥 보기 위해 그것을 땅으로 돌리기도 한다.
cooler=냉각기
cooler-desc=기계는 밀폐된 세상의 숨 막히는 공기에 맞서 힘겨운 싸움을 하며 열을 퍼낸다. 통풍구는 노력으로 덜컹거리고, 그 냉기는 먼 기억처럼 느껴지는 것이다.
metalStorage=금속 저장소
metalStorage-desc=주워 모은 금속 더미가 시간과 방치로 흉터가 난 표면을 드러내며 조용한 파수꾼처럼 우뚝 솟아 있다. 각 조각은 잠재적인 도구, 무기 또는 잃어버린 것에 대한 상기이다.
componentStorage=부품 저장소
componentStorage-desc=뒤틀린 전선과 부서진 회로로 넘쳐나는 상자들, 한때 번성했던 세계의 잔해이다.
rationStorage=배급품 저장소
rationStorage-desc=말린 음식과 통조림 상자들이 선반에 줄지어 있으며, 라벨은 바래고 찢어졌다. 모든 식사는 부족함과 생존을 상기시킨다.
status-running={COLOR=WHITE}%1$s이(가) 내구성 %2$.0f %%로 작동 중이다.
status-broken={COLOR=RED}%1$s이(가) 고장났다.
status-highTemp={COLOR=YELLOW}과열되었다. 최대 작동 온도는 %1$.0f이고, 주변 온도는 %2$.0f이다.
status-lowTemp={COLOR=YELLOW}동결되었다. 최소 작동 온도는 %1$.0f이고, 주변 온도는 %2$.0f이다.
status-worker={COLOR=WHITE}%2$d명의 작업자가 작업 중이며 효율은 %1$.0f %%였다.
status-overWorked={COLOR=YELLOW}아마도 배정된 작업자가 너무 많은 것 같다.
status-underWorked={COLOR=YELLOW}아마도 배정된 작업자가 너무 적은 것 같다.
status-minimumDanger={COLOR=WHITE}작업하기에 비교적 안전하다.
status-mediumDanger={COLOR=YELLOW}작업하기에 위험하다.
status-highDanger={COLOR=RED}작업 조건이 극도로 위험하며, 재난을 방지하기 위해 즉각적인 점검이 필요한 상태이다.
unknownApparatus=알 수 없는 설비
exchangePostCeramic=교환소 (세라믹)
exchangePostCeramic-desc=상인들이 세라믹 물품을 다른 필수품과 교환하는 작은 가판대이다.
exchangePostCottonClothes=교환소 (면 의류)
exchangePostCottonClothes-desc=상인들이 면 의류를 다른 필수품과 교환하는 작은 가판대이다.
exchangePostDiamond=교환소 (다이아몬드)
exchangePostDiamond-desc=상인들이 다이아몬드를 다른 필수품과 교환하는 작은 가판대이다.
exchangePostGlassClothes=교환소 (유리 섬유 의류)
exchangePostGlassClothes-desc=상인들이 유리 섬유 의류를 다른 필수품과 교환하는 작은 가판대이다.
exchangePostCleanWater=교환소 (깨끗한 물)
exchangePostCleanWater-desc=상인들이 깨끗한 물을 다른 필수품과 교환하는 작은 가판대이다.
exchangePostAmmonia=교환소 (암모니아)
exchangePostAmmonia-desc=상인들이 암모니아를 다른 필수품과 교환하는 작은 가판대이다.
exchangePostPlastic=교환소 (플라스틱)
exchangePostPlastic-desc=상인들이 플라스틱을 다른 필수품과 교환하는 작은 가판대이다.
manway=연결구
manway-desc=작고 비좁은 출입구로, 이것이 없으면 이 공간에 드나들 수 없다.
fermentationVat=발효 탱크
fermentationVat-desc=오랜 시간 포도즙과 느린 화학 반응으로 깊게 물든 두들겨 만든 금속의 밀봉된 통입니다. 내부의 꾸준한 졸졸 소리는 인내가 실체화된 소리이며, 원재료를 부유층이 문화라고 부르는 것으로 변환합니다.
brewingTank=양조 탱크
brewingTank-desc=효모와 야망의 냄새가 나는 납작하고 구리 리벳으로 된 탱크입니다. 직원들은 숙련된 주의로 그 내용물을 추출하며, 정거장의 소박한 축하의 답을 이끌어냅니다. 조악하지만 효과적입니다. 이곳의 모든 것처럼.
logisticsHub=물류 허브
logisticsHub-desc=컨베이어, 지게차, 분류 시스템을 갖춘 중앙 집중식 적재 및 배포 시설입니다. 더 많은 인력과 잘 관리된 허브는 자원 이동 속도를 크게 향상시킵니다.
manwayI=연결구 I
manwayI-desc=반경 2미터짜리 좁은 통로로, 방호복을 입은 작업자가 겨우 지나갈 수 있는 최소한의 구조물입니다.
manwayII=연결구 II
manwayII-desc=반경 4미터짜리 중형 통로. 수레와 가벼운 장비를 이동시킬 수 있는 표준 규격입니다.
manwayIII=연결구 III
manwayIII-desc=반경 6미터짜리 대형 통로. 중장비와 대형 수송 차량이 오갈 수 있습니다. 건설 및 유지비가 높지만 주요 거점 근방에는 필수적입니다.
powerLineI=전력선 I
powerLineI-desc=저전력용 경량 전선입니다. 설치 후 작동에는 인원이 필요 없지만 유지보수 인원이 없으면 내구도가 서서히 감소합니다.
powerLineII=전력선 II
powerLineII-desc=중형 전력선으로, 기본 모델보다 훨씬 많은 에너지를 전달할 수 있습니다. 대부분의 기반 시설 통로에 적합한 표준 선택입니다.
powerLineIII=전력선 III
powerLineIII-desc=정거장에서 가장 큰 전력 부하를 감당하는 초고압 케이블입니다. 방치하면 위험하므로 반드시 유지보수 인원을 배치하십시오.
liquidPipeI=액체 배관 I
liquidPipeI-desc=단일 액체 자원을 위한 저압·저내식성 파이프입니다. 저렴하지만 처리량과 내구성이 제한적입니다.
liquidPipeII=액체 배관 II
liquidPipeII-desc=중압·중내식성 파이프. 대부분의 수분 및 화학물질 이송 노선에 적합합니다.
liquidPipeIII=액체 배관 III
liquidPipeIII-desc=고압·고내식성 파이프. 설치 및 수리 비용이 높지만 공격적인 액체도 대량으로 안정적으로 이송할 수 있습니다.
gasPipeI=가스 배관 I
gasPipeI-desc=단일 가스용 저압 도관으로, 안정적인 기체를 적당한 유량으로 처리합니다.
gasPipeII=가스 배관 II
gasPipeII-desc=중압 가스 배관. 개선된 밀봉재와 높은 처리량으로 대부분의 대기 분배 작업에 적합합니다.
gasPipeIII=가스 배관 III
gasPipeIII-desc=반응성 또는 위험 기체를 위한 고압 가스 배관. 누출 방지를 위해 철저한 유지보수가 필요합니다.
pressurizer=가압기 / 펌프 스테이션
pressurizer-desc=액체·가스 배관망을 상향 운반 시 압력을 유지하는 전동 펌프입니다. 이것 없이는 유체가 중력에 맞서 흐르지 않습니다.
pneumaticTube=공압 튜브
pneumaticTube-desc=소형 고가 또는 위험 화물을 캡슐로 빠르게 운반하는 시스템. 매우 빠르지만 건설 비용이 높습니다. 출발지와 목적지 양 끝점에만 설치하면 됩니다.
railway=철도
railway-desc=저비용으로 대량 화물을 이동시키는 전동 레일 시스템. 평탄하거나 완만한 경사 지형이 필요하며 노선 전체에 지속적인 전력 공급이 필요합니다.
warehouse=창고
warehouse-desc=순수 인력으로 자원을 이동시키는 집결·발송 시설. 전력이 필요 없으며, 인원이 많을수록 이송 속도가 빨라집니다. 출발지에 창고가 있으면 연결된 경로 어디로든 수동 수송이 가능합니다.
cartPath=수레 경로
cartPath-desc=손수레와 경량 차량을 위한 평탄화된 노면. 순수 인력 운반보다 빠르지만 인원이 필요합니다. 연결구 II 이상의 통로가 필요하고 급경사는 불가합니다.
elevatorCrane=엘리베이터 / 크레인 / 도르래
elevatorCrane-desc=경사 제한이 없는 범용 수직 리프트 시스템. 처리량은 철도보다 느리지만 수직에 가까운 갱도에서 사용 가능한 유일한 동력 이송 수단입니다.
