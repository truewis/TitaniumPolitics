TRL1=TRL1
TRL1-desc=Basic principles of the technology are observed and reported. Research is primarily paper-based, theoretical, or exploratory with no experimental proof yet. This level provides the scientific foundation for future applied research.
TRL2=TRL2
TRL2-desc=Technology concept and possible applications are formulated. Practical uses are still speculative, and no experimental validation exists. Early-stage research focuses on defining how the principles might be applied.
TRL3=TRL3
TRL3-desc=Analytical and experimental proof-of-concept is achieved. Laboratory experiments begin to validate critical functions or properties. At this stage, feasibility is demonstrated but not in a complete system.
TRL4=TRL4
TRL4-desc=Component or system validation is performed in a laboratory environment. Individual parts of the technology are tested together under controlled conditions. Integration begins, but real-world application is still distant.
TRL5=TRL5
TRL5-desc=Technology components are integrated and validated in a relevant environment. This demonstrates functionality under conditions that resemble real-world scenarios. Key uncertainties are reduced, and scalability starts to be considered.
TRL6=TRL6
TRL6-desc=Prototype system or model is demonstrated in a relevant environment. Testing occurs with higher fidelity than TRL5, showing that the system works under practical conditions. Risk is lowered, but the system is not yet fully operational.
TRL7=TRL7
TRL7-desc=System prototype demonstration occurs in an operational environment. The technology is tested in realistic field conditions, often at near-final scale. This validates performance, though refinements may still be needed.
TRL8=TRL8
TRL8-desc=The actual system is completed and qualified through rigorous testing. The technology is proven to work reliably in its final form and under expected operational conditions. It is ready for full deployment, pending certification or approvals.
TRL9=TRL9
TRL9-desc=The technology has been successfully deployed in real operations. Full functionality and reliability are demonstrated through actual use. At this level, the technology is considered mature and widely implementable.
