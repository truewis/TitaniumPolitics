# Character action dialogue properties
# These are used by ReadOnly.script() to display character speech when actions are performed
# Format: ActionClassName=Dialogue text with optional {VAR=propertyName} placeholders
# Existing properties (preserved from original)
NewAgenda=I have a suggestion.
NewAgenda-Nominate=I think %1$s is well suited for this position.
NewAgenda-Praise=We should praise %1$s for their efforts.
NewAgenda-PraiseParty=We should praise the %1$s for their efforts.
NewAgenda-Denounce=We should not trust %1$s.
NewAgenda-DenounceParty=We should not trust the %1$s.
NewAgenda-Request=I am asking %2$s to work on %1$s.
NewAgenda-Request-High=Your request is duly noticed. Will follow up in no time.
NewAgenda-Request-Medium=Your request makes sense. Will consider it thoroughly.
NewAgenda-Request-Low=Your request is not reasonable at all. Do not expect any follow-ups.
NewAgenda-Promise=I promise to work on %1$s for the benefit of this group.
NewAgenda-ProofOfWork=Why don't we summarize our work so far?
NewAgenda-BudgetProposal=Here is the budget as I propose.
NewAgenda-BudgetResolution=I think we should resolve the budget.
NewAgenda-AppointMeeting=What if we meet at the following time?
NewAgenda-FireManager=I no longer think %1$s is well suited for their job.
NewTalk-KnownPositive=Hello, %1$s! It's good to see you again.
NewTalk-KnownPositiveResponse=Hello, %1$s! How can I help you?
NewTalk-KnownNeutral=Hello, %1$s. We haven't talked in a while.
NewTalk-KnownNeutralResponse=Hello, %1$s. What do you want to discuss?
NewTalk-KnownNegative=Hey, %1$s.
NewTalk-KnownNegativeResponse=Oh, it's you again, %1$s. Make it quick.
NewTalk-Unknown=Hello, I don't believe we've met before. My name is %1$s.
NewTalk-Unknown-workplaceInfo=I am %1$s.
NewTalk-Unknown-workplaceInfo2=I work at %1$s.
NewTalk-Unknown-response=Nice to meet you, %1$s. I am %2$s.
NewTalk-Unknown-agenda=I am here to discuss something with you.
NewTalk-Unknown-agendaResponse=What do you want to discuss?
MeetingDialogue=Hello everyone, we will now start the meeting %1$s.
AddInfoSupport=I might want to add some information here.
AddInfo-Praise-Will-positive=The confidence and self-discipline you have shown is also commendable.
AddInfo-Praise-Will-negative=The confidence and self-discipline you have shown is questionable at best.
AddInfo-Praise-Mutuality-positive=Your willingness to cooperate and work together is greatly appreciated.
AddInfo-Praise-Mutuality-negative=Your willingness to cooperate and work together is lacking and needs improvement.
AddInfo-Praise-positive=Your dedication and hard work have not gone unnoticed.
AddInfo-Praise-negative=Your performance has been subpar and needs significant improvement.
AddInfo-Denounce-Crime-positive=I agree, %1$s's actions are unacceptable and should be condemned.
AddInfo-Denounce-negative=I disagree, %1$s has been a valuable asset to our team and their contributions should be recognized.
AddInfo-Denounce-positive=I agree, %1$s has not been pulling their weight and their performance needs to improve.
AddInfo-Denounce-Neutral=I have mixed feelings about %1$s's performance and would like to see more consistency.
AddInfo-ProofOfWork-positive=It's important to recognize the progress we've made so far.
AddInfo-ProofOfWork-negative=I don't think this evidence is sufficient to support the claim.
AddInfo-ProofOfWork=Let me share what I know about the work that has been done.
AddInfo-Request-positive=This request seems reasonable and I support moving forward with it.
AddInfo-Request-negative=I have concerns about this request and its potential impact on our operations.
AddInfo-Request=I have some information that may be relevant to this request.
AddInfo-Praise=I would like to add some context regarding %1$s's contributions.
AddInfo-Denounce=I have some observations about %1$s that may be relevant.
AddInfo-PraiseParty-positive=The achievements of the %1$s are noteworthy and deserve recognition.
AddInfo-PraiseParty-negative=I believe the %1$s's contributions have been overstated and need critical evaluation.
AddInfo-PraiseParty=I'd like to share some facts about the %1$s's recent activities.
AddInfo-DenounceParty-positive=I agree that the %1$s has failed to meet expectations and should be held accountable.
AddInfo-DenounceParty-negative=I disagree, the %1$s has been making valuable contributions despite the challenges.
AddInfo-DenounceParty=Let me present some information about the %1$s for your consideration.
AddInfo-FireManager-positive=I support this decision, as %1$s has not been performing their duties effectively.
AddInfo-FireManager-negative=I believe %1$s deserves another chance to prove their capabilities.
AddInfo-FireManager=I have some information regarding %1$s's management performance.
AddInfo-Nominate-positive=I fully support this nomination, %1$s is an excellent choice for this position.
AddInfo-Nominate-negative=I have reservations about this nomination and question whether %1$s is the right fit.
AddInfo-Nominate=Let me share what I know about %1$s's qualifications for this position.
AddInfo-BudgetProposal-positive=Your budget proposal is well thought out and addresses our needs effectively.
AddInfo-BudgetProposal-neutral=Your budget proposal has some good points, but there are areas that need further consideration.
AddInfo-BudgetProposal-negative=Your budget proposal has significant flaws that need to be addressed.
AddInfoDisagree=Something don't quite add up here.
EndSpeech=I am done speaking. {VAR=nextSpeaker} might have something to add.
EndSpeech2=I am done speaking. %s might have something to add.
EndMeeting=Since we have no more topics to discuss, I will end the meeting.
Repair=Hmm... Let me see if I can fix this.
OfficialResourceTransfer=Short of production resources at {VAR=where}? I can help with that.
Talk=Just a moment, please.
Move=I have to go now.
# Basic actions
Wait=I'll wait here for a moment.
Sleep=Time to get some rest.
Eat=I need to grab something to eat.
home=I'm going home for now.
# Information and investigation actions
AddInfo=Let me share some additional information.
Examine=Let me take a closer look at this.
InfoAnnounce=I have an important announcement to make.
InfoRequest=I need some information about this matter.
InfoShare=Let me share what I know.
InvestigateAccidentScene=I should investigate what happened here.
ClearAccidentScene=I'll help clean up this mess.
PrepareInfo=I need to prepare some information for the meeting.
# Meeting and communication actions
StartMeeting=Let's begin our meeting.
JoinMeeting=I'll join the discussion.
LeaveMeeting=I need to step out of this meeting.
Chat=Time for a casual conversation.
Intercept=Excuse me, I have something urgent to add.
# Administrative and work actions
AppointMeeting=I'd like to schedule a meeting.
LeaderAssignment=There are some leadership matters to discuss.
BudgetProposal=I have a budget proposal to present.
BudgetResolution=Let's finalize this budget decision.
Salary=We need to discuss compensation matters.
save=I should save my progress on this work.
# Resource and trade actions
UnofficialResourceTransfer=I can help you with some resources, quietly.
Trade=I'd like to make a trade arrangement.
UseItem=Let me use this item.
# Social and relationship actions
praise=Good work on that!
criticize=I have some concerns about this approach.
Resign=I'm afraid I must step down from my position.
# Special and system actions
Command=I have instructions for the team.
observeRequest=I'll keep an eye on this situation.
unofficialCommand=There's something I need handled discreetly.
# Mutuality changes
response-Praise=I appreciate your kind words, %1$s.
response-Denounce=I disagree with your assessment.
response-PraiseByWitness=I agree, they have done a great job.
response-DenounceByWitness=I cannot support that claim, as I have seen their good work firsthand.
response-Intercept=Well, that was not politely said.
response-AddInfo=Thank you for the additional information.
# Party drama dialogues (displayed via showMutualityArrows during meetings)
response-drama-gossip=Spreading rumors about colleagues is simply unacceptable.
response2-drama-gossip=I can't believe you would say such things about me.
response-drama-bullying=That kind of behavior has no place in a professional setting.
response2-drama-bullying=You can't keep treating me like this.
response-drama-creditTheft=Taking credit for someone else's work is dishonest and demoralising.
response2-drama-creditTheft=That was my work and everyone here knows it.
response-drama-favoritism=It's hard to stay motivated when effort is not rewarded fairly.
response2-drama-favoritism=I simply recognise talent where I see it.
response-drama-overwork=Some of us carry the whole team while others do nothing.
response2-drama-overwork=I've been doing my best, despite what you think.
response-drama-jealousy=Instead of envying others, focus on improving yourself.
response2-drama-jealousy=It's not my fault things are going better for me.
response-drama-blame=Pointing fingers at each other only makes things worse.
response2-drama-blame=Don't try to put this on me.
response-drama-exclusion=Excluding a colleague from the group damages the whole team.
response2-drama-exclusion=I'm tired of being left out of everything.
response-drama-rivalry=This constant competition is tearing the team apart.
response2-drama-rivalry=I refuse to back down from a challenge.
response-drama-undermining=Undermining your own leader only weakens the party.
response2-drama-undermining=My authority is not something to be quietly eroded.
