constructionYardNorth=상부 갑판 건설장
constructionYardNorth-desc=용접 연기와 재활용 공기의 끊임없이 가라앉는 안개에 싸인 강철 플랫폼, 매달린 갠트리, 비계의 광활한 공간. 매우 유능한 관리자들이 건설장을 담당하고 있는데, 혼란 속에서 화물, 장비, 심지어 노동자를 잃기가 너무 쉽기 때문입니다.
constructionYardSouth=하부 갑판 건설장
constructionYardSouth-desc=용접 연기와 재활용 공기의 끊임없이 가라앉는 안개에 싸인 강철 플랫폼, 매달린 갠트리, 비계의 광활한 공간. 매우 유능한 관리자들이 건설장을 담당하고 있는데, 혼란 속에서 화물, 장비, 심지어 노동자를 잃기가 너무 쉽기 때문입니다.
mainControlRoom=주 제어실
mainControlRoom-desc=통신 장치와 회의실이 있는 대형 벙커. 각 부서의 리더들이 매일 여기에 모여 내각 회의를 개최합니다. 삼두정(제어자, 관찰자, 기계공)도 매일 여기서 회의를 개최합니다. 이것은 스테이션에서 가장 철저하게 보호되고 유지되는 시설이며, 필수 작업자만 입장할 수 있습니다. 모든 장치와 보안 조치로 인해 공간이 극도로 제한적입니다.
welfareStationWest=복지 스테이션 서쪽
welfareStationWest-desc=복지 스테이션은 도움이 필요한 사람들에게 보호소와 지원을 제공하도록 설계된 상호 연결된 방과 복도의 광대한 복합 시설입니다. 벽은 물품으로 가득 찬 보관함으로 늘어서 있으며, 공기는 소독제 냄새로 무겁습니다. 메인 홀은 피난처를 찾는 사람들을 위해 간이 침대가 줄지어 있는 큰 개방 공간입니다. 의료 장비가 곳곳에 흩어져 있어 도움이 필요한 사람들을 돕습니다. 분위기는 조용한 결단력이며, 직원들은 모든 것을 잃은 사람들에게 돌봄과 지원을 제공하기 위해 지칠 줄 모르고 일합니다.
welfareStationEast=복지 스테이션 동쪽
welfareStationEast-desc=복지 스테이션은 도움이 필요한 사람들에게 보호소와 지원을 제공하도록 설계된 상호 연결된 방과 복도의 광대한 복합 시설입니다. 벽은 물품으로 가득 찬 보관함으로 늘어서 있으며, 공기는 소독제 냄새로 무겁습니다. 메인 홀은 피난처를 찾는 사람들을 위해 간이 침대가 줄지어 있는 큰 개방 공간입니다. 의료 장비가 곳곳에 흩어져 있어 도움이 필요한 사람들을 돕습니다. 분위기는 조용한 결단력이며, 직원들은 모든 것을 잃은 사람들에게 돌봄과 지원을 제공하기 위해 지칠 줄 모르고 일합니다.
excavationShaftA=굴착 갱도 A
excavationShaftA-desc=굴착 갱도는 스테이션의 지하 터널과 광산으로의 주요 접근 지점입니다. 그들은 크고 어둡며 기계와 발소리의 소리로 메아리칩니다. 벽은 금속 격자로 늘어서 있어 아래 터널을 엿볼 수 있습니다. 공기는 먼지와 기름, 금속 냄새로 두껍습니다.
excavationShaftB=굴착 갱도 B
excavationShaftB-desc=굴착 갱도는 스테이션의 지하 터널과 광산으로의 주요 접근 지점입니다. 그들은 크고 어둡며 기계와 발소리의 소리로 메아리칩니다. 벽은 금속 격자로 늘어서 있어 아래 터널을 엿볼 수 있습니다. 공기는 먼지와 기름, 금속 냄새로 두껍습니다.
asteroidMine=소행성 광산
asteroidMine-desc=이것은 우리 조상들이 주변 소행성에서 자원을 추출하기 위해 찾은 창의적인 방법 중 하나입니다. 그러나 대부분의 시간 동안 비어 있습니다.
observatory=천문대
observatory-desc=거주 링 위 높은 곳, 스테이션의 거의 빛이 닿지 않고 발소리가 거의 메아리치지 않는 지역에 잊혀진 천문대가 있습니다. 한때 천체 개구부로 알려졌지만, 그 이름은 오래전에 스테이션 디렉토리와 기억에서 사라졌습니다. 더 이상 아무도 여기에 오지 않습니다; 봉인되어서가 아니라 아무도 밖을 보려 하지 않기 때문입니다. 내부에서는 시설이 침묵 속에서 작동합니다. 인간 유지 관리가 필요 없습니다; 그 회로는 창조자들이 별에게 답을 구하는 것을 멈춘 지 오래 후에도 상속된 목적으로 윙윙거립니다. 공간은 광대하고 차갑고, 시간이 숨쉬기를 멈춘 것처럼 느껴지는 그런 종류의 차가움입니다. 검게 그을린 트러스의 격자가 높은 구형 천장을 요람에 담고 있으며, 그곳에서 단 하나의 개구부가 영원히 열려 있습니다: 더 이상 경이를 끌지 않는 우주를 응시하는 상처.
cemetery=묘지
cemetery-desc=묘지는 엄숙한 장소로, 각각 잊혀진 죽은 자의 몇 가지 소지품을 담고 있는 이름이 적힌 캐비닛의 높고 무채색 벽으로 가득 차 있습니다.
spacePort=우주항
spacePort-desc=사람들은 우주항을 오래전에 잊었지만, 그것은 여전히 거기에 있으며, 스테이션이 성간 여행의 허브였던 시대의 유물입니다.
tankArray=가스 저장 탱크 어레이
tankArray-desc=가스 저장 탱크 어레이는 스테이션 전체에 다양한 가스를 저장하고 분배하도록 설계된 상호 연결된 탱크와 파이프의 광대한 복합 시설입니다. 위험하고 가연성 가스가 여기에 저장되지만, 탱크가 잘 유지되고 정기적으로 검사되는 한 문제를 일으키지 않습니다.
recycleFacilityWest=재활용 시설 서쪽
recycleFacilityWest-desc=재활용 시설은 폐기물을 처리하고 재사용하도록 설계되었습니다. 벽은 도구와 장비로 가득 찬 보관함으로 늘어서 있으며, 공기는 기름과 금속 냄새로 무겁습니다. 메인 홀은 재료를 분류하고 처리하기 위해 설치된 기계 줄이 있는 큰 개방 공간이며, 앞에는 강의를 위한 무대가 있습니다. 분위기는 조용한 집중력이며, 노동자들은 기계의 윙윙거림과 도구가 금속에 부딪히는 소리에 둘러싸여 부지런히 잔해 더미를 분류합니다.
recycleFacilityEast=재활용 시설 동쪽
electrolysisStationSouth=하부 갑판 전기분해 시설
electrolysisStationSouth-desc=여러 대규모 화학 반응기가 여기에 수용되어 있으며, 물이 수소와 산소로 분리됩니다. 공기는 화학 물질 냄새와 끓는 액체 소리로 두껍습니다. 벽은 파이프와 탱크로 늘어서 있으며, 바닥은 화학 물질 유출로 미끄럽습니다.
electrolysisStationNorth=상부 갑판 전기분해 시설
electrolysisStationNorth-desc=여러 대규모 화학 반응기가 여기에 수용되어 있으며, 물이 수소와 산소로 분리됩니다. 공기는 화학 물질 냄새와 끓는 액체 소리로 두껍습니다. 벽은 파이프와 탱크로 늘어서 있으며, 바닥은 화학 물질 유출로 미끄럽습니다.
reservoirEast=물 저수지 동쪽
reservoirEast-desc=물 저수지는 위의 어둠 속으로 뻗어 있는 거대한 탱크와 파이프로 가득 찬 광대하고 동굴 같은 공간입니다. 공기는 축축한 금속 냄새와 기계의 희미한 윙윙거림으로 무겁습니다. 물이 시스템을 통해 흐르며, 그 표면은 희미한 빛에 희미하게 반짝입니다. 벽은 녹슨 금속 격자로 늘어서 있어 물의 깊이를 엿볼 수 있습니다. 때때로 물이 튀거나 기계가 덜컥거리는 먼 소리를 들을 수 있으며, 동굴 같은 공간을 통해 메아리칩니다.
reservoirWest=물 저수지 서쪽
reservoirWest-desc=물 저수지는 위의 어둠 속으로 뻗어 있는 거대한 탱크와 파이프로 가득 찬 광대하고 동굴 같은 공간입니다. 공기는 축축한 금속 냄새와 기계의 희미한 윙윙거림으로 무겁습니다. 물이 시스템을 통해 흐르며, 그 표면은 희미한 빛에 희미하게 반짝입니다. 벽은 녹슨 금속 격자로 늘어서 있어 물의 깊이를 엿볼 수 있습니다. 때때로 물이 튀거나 기계가 덜컥거리는 먼 소리를 들을 수 있으며, 동굴 같은 공간을 통해 메아리칩니다.
miningSchool=광산 훈련 학교
miningSchool-desc=광산 훈련 학교는 학생들에게 광산에서 생존하는 데 필요한 기술과 지식을 제공합니다. 메인 홀은 학생들이 작업할 책상 줄이 있는 큰 개방 공간이며, 앞에는 강의를 위한 무대가 있습니다. 분위기는 조용한 집중력이며, 학생들은 기계의 윙윙거림과 도구가 금속에 부딪히는 소리에 둘러싸여 부지런히 프로젝트를 작업합니다.
techSchool=공학 훈련 학교
techSchool-desc=공학 훈련 학교는 선별된 소수의 학생들에게 스테이션의 미래를 위해 필요한 기술과 지식을 제공합니다. 메인 홀은 학생들이 작업할 책상 줄이 있는 큰 개방 공간이며, 앞에는 강의를 위한 무대가 있습니다. 분위기는 조용한 집중력이며, 학생들은 기계의 윙윙거림과 도구가 금속에 부딪히는 소리에 둘러싸여 부지런히 프로젝트를 작업합니다.
farm=수경 재배 농장
farm-desc=생명공학 부서는 여기에서 몇 가지 다른 종류의 작물을 재배합니다. 전체 스테이션의 운명은 이 농장의 성공에 달려 있습니다. 작물은 줄로 재배되며, 각 식물은 작업자 팀에 의해 신중하게 관리됩니다. 공기는 흙과 식물의 냄새로 가득 차 있으며, 관개 시스템에서 물이 떨어지는 소리가 납니다.
rescueStationNorth=상부 갑판 구조 스테이션
rescueStationNorth-desc=안전 부서 구성원들이 도움이 필요한 사람들을 구조하기 위한 노력을 계획하고 조정하기 위해 모이는 곳입니다. 이름에도 불구하고, 그들은 또한 비상사태의 경우 무력을 사용할 권한이 있습니다.
rescueStationSouth=하부 갑판 구조 스테이션 동쪽
rescueStationSouth-desc=안전 부서 구성원들이 도움이 필요한 사람들을 구조하기 위한 노력을 계획하고 조정하기 위해 모이는 곳입니다. 이름에도 불구하고, 그들은 또한 비상사태의 경우 무력을 사용할 권한이 있습니다.
rescueStationWest=하부 갑판 구조 스테이션 서쪽
rescueStationWest-desc=안전 부서 구성원들이 도움이 필요한 사람들을 구조하기 위한 노력을 계획하고 조정하기 위해 모이는 곳입니다. 이름에도 불구하고, 그들은 또한 비상사태의 경우 무력을 사용할 권한이 있습니다.
securityCheckWest=보안 검문소 서쪽
securityCheckWest-desc=보안 검문소는 상부 갑판의 빈곤과 혼란으로부터 하부 갑판을 보호합니다. 그들은 압력 도어로 강력하게 요새화되어 있습니다. 중무장한 경비원들이 지역을 순찰하며, 그들의 눈은 어떤 문제의 징후도 찾고 있습니다. 검문소는 무기와 밀수품을 탐지할 수 있는 스캐너가 장착되어 있어, 안전하다고 간주되는 사람들만 통과할 수 있습니다. 분위기는 긴장되어 있으며, 벽 너머에 도사리고 있는 위험의 끊임없는 위협이 있습니다.
securityCheckEast=보안 검문소 동쪽
securityCheckEast-desc=보안 검문소는 상부 갑판의 빈곤과 혼란으로부터 하부 갑판을 보호합니다. 그들은 압력 도어로 강력하게 요새화되어 있습니다. 중무장한 경비원들이 지역을 순찰하며, 그들의 눈은 어떤 문제의 징후도 찾고 있습니다. 검문소는 무기와 밀수품을 탐지할 수 있는 스캐너가 장착되어 있어, 안전하다고 간주되는 사람들만 통과할 수 있습니다. 분위기는 긴장되어 있으며, 벽 너머에 도사리고 있는 위험의 끊임없는 위협이 있습니다.
securityCheckCenter=보안 검문소 중앙
securityCheckCenter-desc=보안 검문소는 상부 갑판의 빈곤과 혼란으로부터 하부 갑판을 보호합니다. 그들은 압력 도어로 강력하게 요새화되어 있습니다. 중무장한 경비원들이 지역을 순찰하며, 그들의 눈은 어떤 문제의 징후도 찾고 있습니다. 검문소는 무기와 밀수품을 탐지할 수 있는 스캐너가 장착되어 있어, 안전하다고 간주되는 사람들만 통과할 수 있습니다. 분위기는 긴장되어 있으며, 벽 너머에 도사리고 있는 위험의 끊임없는 위협이 있습니다.
market=공공 시장
market-desc=교통의 동맥과 유지 보수 샤프트의 정맥 사이에 끼어 있는 시장은 억제된 익명성 속에 펼쳐져 있습니다. 그중 가장 큰 것은 상부 스테이션에 있습니다: 의심스러운 품질이지만 부인할 수 없는 저렴한 제품을 제공하는 실용적인 상점들의 줄이 있는 광활한 복도. 이것은 형태보다 기능이 우선하는 곳이며, 실용성이 싼 금속 패키지로 포장되는 곳입니다. 이것은 의심스러운 품질의 사람들이 고용되는 곳입니다. 충분히 날카로운 감각이 있다면 잔해 더미에서 보석을 찾을 수 있을 것입니다.
squareNorth=상부 갑판 공공 광장
squareNorth-desc=각 갑판의 중심에 서 있는 상부 및 하부 공공 광장은 단련된 티타늄의 견고한 보 위에 세워져 있습니다. 광장 자체는 야망의 유물이며, 한때 무역과 문화의 허브로 구상되었습니다. 이제 그들은 환기구를 통해 과거가 윙윙거리고, 희미하고 깜박이는 인공 조명 속에서 그림자가 길게 떨어지는 곳입니다. 그래도 때때로 아이들이 놀고 상인들이 흥얼거리는 소리를 들을 수 있으며, 그들을 기다리는 음울한 미래를 모릅니다. 스테이션의 대부분의 거대 구조물과 마찬가지로, 광장은 생존하는 역사 기록보다 오래전에 세워졌습니다. 그들은 승객과 화물을 위한 공간을 만들기 위해 내부 구조물을 철거하여 스테이션의 확장 단계 동안 건설된 것으로 생각됩니다. 그들은 그러한 규모에서 시도된 최초의 시민 공간이었습니다. 그들의 설계는 대담했습니다: 광대한 공허를 둘러싼 원형 복도, 위에는 상상할 수 없는 높이에 매달린 엘리베이터 샤프트가 있습니다. 어두운 합금 타일의 테셀레이션은 수없이 많은 부츠, 바퀴, 꿈의 긁힌 자국을 지니고 있습니다. 가장자리 주변에는 녹슨 노점상과 휴면 정보 키오스크가 남아 있지만, 일부는 여전히 작동하는 것처럼 보입니다. 스테이션 코어 깊숙한 곳에서 일정한 저주파 윙윙거림이 맥동하며, 표면 아래 거대하고 고대의 무언가의 숨결처럼 느껴집니다.
squareSouth=하부 갑판 공공 광장
squareSouth-desc=각 갑판의 중심에 서 있는 상부 및 하부 공공 광장은 단련된 티타늄의 견고한 보 위에 세워져 있습니다. 광장 자체는 야망의 유물이며, 한때 무역과 문화의 허브로 구상되었습니다. 이제 그들은 환기구를 통해 과거가 윙윙거리고, 희미하고 깜박이는 인공 조명 속에서 그림자가 길게 떨어지는 곳입니다. 그래도 때때로 아이들이 놀고 상인들이 흥얼거리는 소리를 들을 수 있으며, 그들을 기다리는 음울한 미래를 모릅니다. 스테이션의 대부분의 거대 구조물과 마찬가지로, 광장은 생존하는 역사 기록보다 오래전에 세워졌습니다. 그들은 승객과 화물을 위한 공간을 만들기 위해 내부 구조물을 철거하여 스테이션의 확장 단계 동안 건설된 것으로 생각됩니다. 그들은 그러한 규모에서 시도된 최초의 시민 공간이었습니다. 그들의 설계는 대담했습니다: 광대한 공허를 둘러싼 원형 복도, 위에는 상상할 수 없는 높이에 매달린 엘리베이터 샤프트가 있습니다. 어두운 합금 타일의 테셀레이션은 수없이 많은 부츠, 바퀴, 꿈의 긁힌 자국을 지니고 있습니다. 가장자리 주변에는 녹슨 노점상과 휴면 정보 키오스크가 남아 있지만, 일부는 여전히 작동하는 것처럼 보입니다. 스테이션 코어 깊숙한 곳에서 일정한 저주파 윙윙거림이 맥동하며, 표면 아래 거대하고 고대의 무언가의 숨결처럼 느껴집니다.
theEngine=엔진
theEngine-desc=엔진은 스테이션의 심장이며, 조명부터 생명 유지 시스템까지 모든 것에 전력을 공급하는 거대하고 복잡한 기계입니다. 방사성 원자로가 낮고 꾸준한 고동으로 윙윙거리며, 그들의 열이 벽을 뚫고 있습니다. 아무도 선택으로 여기에 머물지 않습니다; 그것의 끌림은 의무이지 욕망이 아닙니다.
outerBarrierWest=외부 장벽 서쪽
outerBarrierWest-desc=외부 장벽은 우주의 가혹한 환경으로부터 스테이션을 보호하는 거대하고 강화된 구조물입니다. 그것은 두껍고 무거운 금속판으로 만들어졌으며 극한 온도와 압력을 견디도록 설계되었습니다. 장벽은 잠재적 위협을 위해 주변 지역을 모니터링하는 센서와 카메라가 장착되어 있습니다.
outerBarrierEast=외부 장벽 동쪽
outerBarrierEast-desc=외부 장벽은 우주의 가혹한 환경으로부터 스테이션을 보호하는 거대하고 강화된 구조물입니다. 그것은 두껍고 무거운 금속판으로 만들어졌으며 극한 온도와 압력을 견디도록 설계되었습니다. 장벽은 잠재적 위협을 위해 주변 지역을 모니터링하는 센서와 카메라가 장착되어 있습니다.
outerBarrierCenter=외부 장벽 중앙
outerBarrierCenter-desc=외부 장벽은 우주의 가혹한 환경으로부터 스테이션을 보호하는 거대하고 강화된 구조물입니다. 그것은 두껍고 무거운 금속판으로 만들어졌으며 극한 온도와 압력을 견디도록 설계되었습니다. 장벽은 잠재적 위협을 위해 주변 지역을 모니터링하는 센서와 카메라가 장착되어 있습니다.
home=%1$s의 거주 구역
home-desc=이것은 거주 구역이며, 휴식과 회복의 장소입니다.
industryHeadquarters=산업 부서 본부
industryHeadquarters-desc=산업 부서의 본부.
infrastructureHeadquarters=인프라 부서 본부
infrastructureHeadquarters-desc=인프라 부서의 본부.
safetyHeadquarters=안전 부서 본부
safetyHeadquarters-desc=안전 부서의 본부.
bioengineeringHeadquarters=생명공학 부서 본부
bioengineeringHeadquarters-desc=생명공학 부서의 본부.
interiorHeadquarters=내무 부서 본부
interiorHeadquarters-desc=내무 부서의 본부.
educationHeadquarters=교육 부서 본부
educationHeadquarters-desc=교육 부서의 본부.
miningHeadquarters=광산 부서 본부
miningHeadquarters-desc=광산 부서의 본부.
tavern=녹슨 렌치 선술집
tavern-desc=오래된 맥주와 튀긴 음식 냄새로 가득 찬 희미하게 조명된 선술집. 벽은 오래되고 바랜 포스터와 장식으로 재사용된 광산 장비로 장식되어 있습니다. 공기는 부딪히는 잔, 시끄러운 웃음, 때때로 벌어지는 싸움의 소리로 두껍습니다. 손님들은 지친 광부, 비번 보안 요원, 가끔 지나가는 여행자의 혼합입니다.
